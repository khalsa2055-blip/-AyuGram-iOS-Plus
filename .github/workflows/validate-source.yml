name: AyuGram-iOS-Plus CI

on:
  push:
    branches: [main, feature/media-edit-archive]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-upstream:
    name: Verify Swiftgram source and build prerequisites
    runs-on: macos-26
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out Swiftgram source
        uses: actions/checkout@v4
        with:
          repository: Swiftgram/Telegram-iOS
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Apply media-edit archive integration
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_media_edit_archive.py upstream
          grep -q "ayuGramArchiveOriginalMediaBeforeEdit" upstream/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
          grep -q "AyuGramMediaEditOriginalPreviewController" upstream/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
          echo "Pre-edit archive hook and View Original action are present."

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/README.md
          test -f upstream/versions.json
          test -f upstream/build-system/Make/Make.py
          test -f upstream/build-system/template_minimal_development_configuration.json
          test -d upstream/Telegram
          test -d upstream/Swiftgram
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("upstream/versions.json")
          data = json.loads(p.read_text())
          for key in ("app", "xcode", "bazel", "macos"):
              assert key in data, f"Missing {key} in versions.json"
          print("Swiftgram source structure: OK")
          print("Upstream app version:", data["app"])
          print("Required Xcode:", data["xcode"])
          print("Required macOS runner:", data["macos"])
          PY

      - name: Report build configuration requirements
        shell: bash
        run: |
          echo "Source validation passed."
          echo "A personal Telegram API ID/hash are required before building a customized IPA."
          echo "Signing and iLoader installation are separate from source validation."

  build-and-launch-ios-simulator:
    name: Build and launch iOS Simulator
    needs: validate-upstream
    if: ${{ github.ref == 'refs/heads/feature/media-edit-archive' }}
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out Swiftgram source
        uses: actions/checkout@v4
        with:
          repository: Swiftgram/Telegram-iOS
          ref: master
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Apply media-edit archive integration
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/apply_media_edit_archive.py upstream

      - name: Test invite-preview policy and audit native Telegram route
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Experiments/PrivateInviteLinkInspector
          python3 Scripts/apply_private_invite_preview.py --upstream upstream --package Experiments/PrivateInviteLinkInspector

      # Reuse Bazel's downloaded dependencies and compiled action outputs between runs.
      # The cache is scoped to the runner OS and upstream revision, with a fallback
      # to the previous simulator cache so a small code change stays incremental.
      - name: Cache Bazel simulator build
        id: bazel-cache
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-simulator-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}-${{ hashFiles('Scripts/apply_media_edit_archive.py') }}
          restore-keys: |
            bazel-simulator-${{ runner.os }}-${{ github.ref_name }}-
            bazel-simulator-${{ runner.os }}-

      - name: Validate simulator build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_ID" || { echo "Missing API_ID secret"; exit 1; }
          test -n "$API_HASH" || { echo "Missing API_HASH secret"; exit 1; }
          xcodebuild -version
          xcrun simctl list devices available

      - name: Resolve app identity
        id: app
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib, subprocess
          from pathlib import Path
          profile = Path("build-system/fake-codesigning/profiles/Telegram.mobileprovision")
          decoded = subprocess.check_output(["security", "cms", "-D", "-i", str(profile)])
          data = plistlib.loads(decoded)
          app_id = data["Entitlements"]["application-identifier"]
          team_id = data["TeamIdentifier"][0]
          prefix = team_id + "."
          if not app_id.startswith(prefix):
              raise SystemExit(f"Fake profile TeamIdentifier mismatch: {app_id}")
          bundle_id = app_id[len(prefix):]
          if not bundle_id or "*" in bundle_id:
              raise SystemExit(f"Unsupported application-identifier: {app_id}")
          print(f"team_id={team_id}")
          print(f"bundle_id={bundle_id}")
          PY

      - name: Create simulator configuration
        shell: bash
        env:
          TEAM_ID: ${{ steps.app.outputs.team_id }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          template = json.loads(Path("upstream/build-system/template_minimal_development_configuration.json").read_text())
          template.update({
              "bundle_id": os.environ["BUNDLE_ID"],
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": os.environ["TEAM_ID"],
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "ayugramplus"
          })
          Path("upstream/ayugramplus-simulator-configuration.json").write_text(json.dumps(template, indent=2))
          PY

      - name: Build simulator app
        id: simulator-build
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="ayugramplus-simulator-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --configuration=debug_sim_arm64 \
            --buildNumber="$BUILD_NUMBER"
          IPA_PATH="bazel-bin/Telegram/Swiftgram.ipa"
          test -f "$IPA_PATH" || { echo "Simulator IPA was not produced"; find bazel-out -name '*.ipa' -print | head -50; exit 1; }
          EXTRACT_DIR="$RUNNER_TEMP/swiftgram-simulator-ipa"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$IPA_PATH" "$EXTRACT_DIR"
          APP_PATH="$(find "$EXTRACT_DIR" -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "No .app bundle inside simulator IPA"; find "$EXTRACT_DIR" -maxdepth 5 -print | head -100; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Save immediately after a successful compile, before optional verification or simulator
      # launch steps can fail. This ensures a failed verification does not discard the build cache.
      - name: Save Bazel simulator cache
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-simulator-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}-${{ hashFiles('Scripts/apply_media_edit_archive.py') }}

      - name: Verify media-edit feature is linked into the app
        shell: bash
        run: |
          set -euo pipefail
          CORE_BINARY="$APP_PATH/Frameworks/TelegramCoreFramework.framework/TelegramCoreFramework"
          UI_BINARY="$APP_PATH/Frameworks/TelegramUIFramework.framework/TelegramUIFramework"
          test -f "$CORE_BINARY" || { echo "Missing TelegramCoreFramework binary: $CORE_BINARY"; exit 1; }
          test -f "$UI_BINARY" || { echo "Missing TelegramUIFramework binary: $UI_BINARY"; exit 1; }
          strings "$CORE_BINARY" > "$RUNNER_TEMP/core-strings.txt"
          strings "$UI_BINARY" > "$RUNNER_TEMP/ui-strings.txt"
          grep -Fq "AyuGramMediaEditArchive" "$RUNNER_TEMP/core-strings.txt" || { echo "Missing Core marker: AyuGramMediaEditArchive"; exit 1; }
          grep -Fq "View Original" "$RUNNER_TEMP/ui-strings.txt" || { echo "Missing UI marker: View Original"; exit 1; }
          grep -Fq "Original media" "$RUNNER_TEMP/ui-strings.txt" || { echo "Missing UI marker: Original media"; exit 1; }
          echo "PASS: archive storage and View Original UI markers are present in compiled frameworks."

      - name: Install and launch in iOS Simulator
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
        run: |
          set -euo pipefail
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))' )"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID"
          sleep 20
          xcrun simctl io "$DEVICE_UDID" screenshot simulator-launch.png
          xcrun simctl spawn "$DEVICE_UDID" log show --last 2m --style compact --predicate 'process == "Swiftgram"' > simulator-app.log || true

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-Simulator-Evidence
          path: |
            simulator-launch.png
            simulator-app.log
            upstream/bazel-bin/Telegram/Swiftgram.ipa
          if-no-files-found: warn
          retention-days: 7
