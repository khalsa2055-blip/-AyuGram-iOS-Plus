name: Merge Swiftgram + AyuGram iOS

on:
  workflow_dispatch:
  push:
    branches: [integrate-swiftgram-ayugram]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-and-build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout integration configuration
        uses: actions/checkout@v4

      - name: Checkout latest Swiftgram base
        uses: actions/checkout@v4
        with:
          repository: Swiftgram/Telegram-iOS
          ref: master
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Fetch AyuGram iOS and merge its changes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add ayugram https://github.com/maksakks/Ayugram-iOS.git
          git fetch ayugram master --tags
          echo "Swiftgram base: $(git rev-parse HEAD)"
          echo "AyuGram source: $(git rev-parse ayugram/master)"
          echo "Merge base: $(git merge-base HEAD ayugram/master)"
          # Keep Swiftgram's BUILD rule definitions: AyuGram's older Telegram/BUILD
          # uses the old plist_fragment API and breaks against Swiftgram's newer Bazel rules.
          git show HEAD:Telegram/BUILD > /tmp/swiftgram-telegram-build
          git show HEAD:submodules/SettingsUI/BUILD > /tmp/swiftgram-settingsui-build
          # Keep Swiftgram's newer history/features; when the same lines conflict,
          # prefer AyuGram's implementation so its fork-specific changes are retained.
          if ! git -c core.filemode=false merge --no-commit --no-ff -X theirs ayugram/master; then
            echo "Merge reported conflicts; resolving automatically while preserving Swiftgram deletions."
            git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                # Both branches have this path: prefer AyuGram's version for conflicted content.
                git checkout --theirs -- "$path"
                git add -- "$path"
              else
                # Swiftgram intentionally removed this path; do not resurrect it from the older fork.
                git rm -f -- "$path"
              fi
            done
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git status --short
            echo "::error::Unresolved merge conflicts remain."
            exit 1
          fi
          git commit -m "Integrate AyuGram iOS changes into current Swiftgram"
          # Restore Swiftgram's compatible BUILD definitions after the merge.
          cp /tmp/swiftgram-telegram-build Telegram/BUILD
          cp /tmp/swiftgram-settingsui-build submodules/SettingsUI/BUILD
          # Restore Swiftgram's notification-filtering entitlement fragment if needed.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Telegram/BUILD")
          content = path.read_text()
          if "notification_filtering_fragment" in content and "official_notification_filtering_fragment =" not in content:
              anchor = 'communication_notifications_fragment = official_communication_notifications_fragment # if telegram_bundle_id in official_bundle_ids else ""'
              patch = anchor + '''

          official_notification_filtering_fragment = """
          <key>com.apple.developer.usernotifications.filtering</key>
          <true/>
          """
          notification_filtering_fragment = official_notification_filtering_fragment if telegram_bundle_id == "app.swiftgram.ios" else ""'''
              if anchor not in content:
                  raise SystemExit("Could not find entitlement insertion point in Telegram/BUILD")
              path.write_text(content.replace(anchor, patch, 1))
              print("Restored missing Swiftgram notification-filtering entitlement fragment.")
          else:
              print("Notification-filtering entitlement fragment already present or unused.")
          PY
          # AyuGram adds TextFormat to sgdeps, while Swiftgram already declares
          # the same dependency in TranslateUI's deps list. Remove the duplicate
          # from sgdeps so Bazel can analyze the merged target.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("submodules/TranslateUI/BUILD")
          content = path.read_text()
          # Remove the TextFormat entry from sgdeps regardless of whitespace.
          start = content.find("sgdeps = [")
          end = content.find("]", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not find sgdeps list in TranslateUI/BUILD")
          block = content[start:end]
          lines = block.splitlines(keepends=True)
          filtered = [line for line in lines if "//submodules/TextFormat:TextFormat" not in line]
          if len(filtered) != len(lines):
              content = content[:start] + "".join(filtered) + content[end:]
              path.write_text(content)
              print("Removed duplicate TextFormat dependency from TranslateUI sgdeps.")
          else:
              print("TranslateUI sgdeps already has no TextFormat entry.")
          PY
          # These files compile against Swiftgram's newer TelegramCore APIs.
          # AyuGram's older versions introduce duplicate translation declarations,
          # malformed merged Translate.swift, and PeerColor/PeerNameColor conflicts.
          # Keep Swiftgram's implementations for these API-boundary files until
          # AyuGram changes can be ported as compatible patches instead of wholesale
          # overwrites. The first parent is the exact Swiftgram revision checked out
          # before the merge.
          git checkout HEAD^1 -- \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/Translate.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/TelegramEngineMessages.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Peers/Peer.swift \
            submodules/TelegramCore/Sources/SyncCore/SyncCore_TranslationMessageAttribute.swift \
            submodules/TelegramCore/Sources/Account/AccountManager.swift \
            submodules/TelegramCore/Sources/State/AccountTaskManager.swift \
            submodules/TelegramCore/Sources/Utils/PeerUtils.swift \
            Swiftgram/SGIQTP/Sources/SGIQTP.swift
            submodules/LegacyComponents/Sources/TGMediaPickerGalleryInterfaceView.m
          echo "Restored Swiftgram API-boundary source files after AyuGram merge."
          git log -1 --oneline

      - name: Validate required build credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_ID" || { echo "::error::Add API_ID to repository Actions secrets"; exit 1; }
          test -n "$API_HASH" || { echo "::error::Add API_HASH to repository Actions secrets"; exit 1; }

      - name: Select Xcode required by merged source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Create app configuration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          template = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          template.update({
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": os.environ.get("TEAM_ID") or "C67CF9S4VU",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg"
          })
          Path("ayugramplus-ci-configuration.json").write_text(json.dumps(template, indent=2))
          PY

      - name: Build iOS IPA
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Use Swiftgram's bundle-ID-specific profiles for ph.telegra.Telegraph.
          # The generic fake profiles do not include aps-environment for this app ID.
          PROFILE_SOURCE="buildbox/fake-codesigning/profiles/appstore"
          test -d "$PROFILE_SOURCE" || { echo "::error::Missing appstore provisioning profiles at $PROFILE_SOURCE"; exit 1; }
          mkdir -p build-system/fake-codesigning/profiles
          cp "$PROFILE_SOURCE"/*.mobileprovision build-system/fake-codesigning/profiles/
          echo "Checking matching provisioning profile APS entitlement..."
          python3 - <<'PY'
          import os, plistlib, subprocess, sys
          from pathlib import Path
          team = os.environ.get("TEAM_ID") or "C67CF9S4VU"
          bundle = "ph.telegra.Telegraph"
          found = False
          for path in Path("build-system/fake-codesigning/profiles").glob("*.mobileprovision"):
              decoded = subprocess.run(
                  ["openssl", "smime", "-inform", "der", "-verify", "-noverify", "-in", str(path)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
              ).stdout
              profile = plistlib.loads(decoded)
              ent = profile.get("Entitlements", {})
              app_id = ent.get("application-identifier", "")
              if app_id == f"{team}.{bundle}":
                  found = True
                  print(f"Matched profile: {path.name}; aps-environment={ent.get('aps-environment', '<missing>')}")
                  if "aps-environment" not in ent:
                      print("::error::Matching profile is missing aps-environment")
                      sys.exit(1)
          if not found:
              print(f"::error::No profile matches {team}.{bundle}")
              sys.exit(1)
          PY
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="ayugramplus-ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p build/artifacts
          found=0
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then cp "$f" build/artifacts/AyuGram-iOS-Plus-SideStore.ipa; found=1; break; fi
          done
          test "$found" -eq 1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-SideStore-IPA
          path: source/build/artifacts/AyuGram-iOS-Plus-SideStore.ipa
          if-no-files-found: error
          retention-days: 7
