name: Merge Swiftgram + AyuGram iOS

on:
  workflow_dispatch:
  push:
    branches: [integrate-swiftgram-ayugram]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-and-build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout integration configuration
        uses: actions/checkout@v4

      - name: Checkout latest Swiftgram base
        uses: actions/checkout@v4
        with:
          repository: Swiftgram/Telegram-iOS
          ref: master
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Port deleted-media retention onto Swiftgram
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Do not merge the unrelated AyuGram-iOS fork. AyuGram's original project is
          # desktop-only, so adapt the behavior to Swiftgram's current iOS deletion path.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessages.swift")
          source = path.read_text()
          if "import SQLite3" not in source:
              source = source.replace("import Foundation\n", "import Foundation\nimport SQLite3\n", 1)
          anchor = """func addMessageMediaResourceIdsToRemove(message: Message, resourceIds: inout [MediaResourceId]) {
              for media in message.effectiveMedia {
                  addMessageMediaResourceIdsToRemove(media: media, resourceIds: &resourceIds)
              }
          }
          """
          helper = anchor + r'''

          // Keep a local copy of already-cached photo/video media before Telegram removes
          // the message and its media references. This is a selective iOS adaptation;
          // AyuGram Desktop's current media mapper itself leaves media support TODO.
          private func ayuGramSaveDeletedMedia(message: Message, mediaBox: MediaBox) {
              let fileManager = FileManager.default
              guard let documents = fileManager.urls(for: .documentDirectory, in: .userDomainMask).first else {
                  return
              }
              let root = documents.appendingPathComponent("AyuGram/saved", isDirectory: true)
              let datePrefix = String(message.timestamp)
              let messagePrefix = String(message.id.id)
              
              for (mediaIndex, media) in message.effectiveMedia.enumerated() {
                  var sourcePath: String?
                  var folder = "pictures"
                  var fileExtension = "jpg"
                  
                  if let image = media as? TelegramMediaImage {
                      // Use the largest representation, which is normally last.
                      guard let representation = image.representations.last else {
                          continue
                      }
                      let paths = mediaBox.storePathsForId(representation.resource.id)
                      sourcePath = paths.complete
                      fileExtension = "jpg"
                  } else if let file = media as? TelegramMediaFile {
                      let isVideo = file.mimeType.lowercased().hasPrefix("video/") ||
                          file.attributes.contains(where: {
                              if case .Video = $0 { return true }
                              return false
                          })
                      guard isVideo else {
                          continue
                      }
                      let paths = mediaBox.storePathsForId(file.resource.id)
                      sourcePath = paths.complete
                      folder = "videos"
                      if let name = file.fileName, let ext = name.split(separator: ".").last, !ext.isEmpty {
                          fileExtension = String(ext).lowercased()
                      } else if file.mimeType.lowercased().contains("mp4") {
                          fileExtension = "mp4"
                      }
                  } else {
                      continue
                  }
                  
                  guard let sourcePath, fileManager.fileExists(atPath: sourcePath) else {
                      // The media was not fully cached at deletion time; do not create a
                      // broken entry or block Telegram's delete transaction waiting for it.
                      continue
                  }
                  
                  let directory = root.appendingPathComponent(folder, isDirectory: true)
                  do {
                      try fileManager.createDirectory(at: directory, withIntermediateDirectories: true)
                      let destination = directory.appendingPathComponent(datePrefix + "_" + messagePrefix + "_" + String(mediaIndex) + "." + fileExtension)
                      if !fileManager.fileExists(atPath: destination.path) {
                          try fileManager.copyItem(atPath: sourcePath, toPath: destination.path)
                      }
                  } catch {
                      // Saving media must never prevent message deletion.
                  }
              }
          }

          // Persist message text/metadata as well as cached photo/video files.
          // One JSON record per deleted message, stored locally inside the app.
          private func ayuGramSaveDeletedMessage(message: Message) {
              let fileManager = FileManager.default
              guard let documents = fileManager.urls(for: .documentDirectory, in: .userDomainMask).first else {
                  return
              }
              let directory = documents.appendingPathComponent("AyuGram/saved", isDirectory: true)
              do {
                  try fileManager.createDirectory(at: directory, withIntermediateDirectories: true)
                  let databaseURL = directory.appendingPathComponent("ayugram.sqlite")
                  var database: OpaquePointer?
                  let openResult = sqlite3_open_v2(databaseURL.path, &database, SQLITE_OPEN_CREATE | SQLITE_OPEN_READWRITE | SQLITE_OPEN_FULLMUTEX, nil)
                  guard openResult == SQLITE_OK, let database else {
                      if let database { sqlite3_close(database) }
                      return
                  }
                  defer { sqlite3_close(database) }
                  let schema = """
                  CREATE TABLE IF NOT EXISTS deleted_messages (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      peer_id TEXT NOT NULL,
                      message_id INTEGER NOT NULL,
                      timestamp INTEGER NOT NULL,
                      text TEXT NOT NULL,
                      saved_at INTEGER NOT NULL,
                      UNIQUE(peer_id, message_id)
                  );
                  CREATE INDEX IF NOT EXISTS idx_deleted_messages_timestamp ON deleted_messages(timestamp);
                  """
                  guard sqlite3_exec(database, schema, nil, nil, nil) == SQLITE_OK else { return }
                  func sqlQuote(_ value: String) -> String {
                      return "'" + value.replacingOccurrences(of: "'", with: "''") + "'"
                  }
                  let peerId = sqlQuote(String(describing: message.id.peerId))
                  let text = sqlQuote(message.text)
                  let timestamp = Int(message.timestamp)
                  let messageId = Int(message.id.id)
                  let savedAt = Int(Date().timeIntervalSince1970)
                  let statement = """
                  INSERT OR IGNORE INTO deleted_messages (peer_id, message_id, timestamp, text, saved_at)
                  VALUES (\(peerId), \(messageId), \(timestamp), \(text), \(savedAt));
                  """
                  guard sqlite3_exec(database, statement, nil, nil, nil) == SQLITE_OK else {
                      // Retention must never block Telegram's deletion operation.
                      return
                  }
              } catch {
                  // Retention must never block Telegram's deletion operation.
              }
          }
          
          // Preserve deleted cloud messages in the local chat timeline and attach a visible trash marker.
          // The original, unmodified text is saved separately before the local row is updated.
          func ayuGramRetainDeletedMessages(transaction: Transaction, mediaBox: MediaBox, ids: [MessageId]) -> Set<MessageId> {
              var retained = Set<MessageId>()
              for id in ids {
                  guard id.namespace == Namespaces.Message.Cloud,
                        id.peerId.namespace != Namespaces.Peer.SecretChat,
                        let message = transaction.getMessage(id) else {
                      continue
                  }
                  
                  if message.text == "🗑️" || message.text.hasSuffix(" 🗑️") || message.text.hasSuffix("\n🗑️") {
                      retained.insert(id)
                      continue
                  }
                  
                  ayuGramSaveDeletedMessage(message: message)
                  ayuGramSaveDeletedMedia(message: message, mediaBox: mediaBox)
                  
                  let updatedText = message.text.isEmpty ? "🗑️" : message.text + " 🗑️"
                  let updatedMessage = StoreMessage(
                      id: message.id,
                      customStableId: message.stableId,
                      globallyUniqueId: message.globallyUniqueId,
                      groupingKey: message.groupingKey,
                      threadId: message.threadId,
                      timestamp: message.timestamp,
                      flags: StoreMessageFlags(rawValue: message.flags.rawValue),
                      tags: message.tags,
                      globalTags: message.globalTags,
                      localTags: message.localTags,
                      forwardInfo: message.forwardInfo.map { StoreMessageForwardInfo($0) },
                      authorId: message.author?.id,
                      text: updatedText,
                      attributes: message.attributes,
                      media: message.media
                  )
                  transaction.updateMessage(id) { _ in
                      return .update(updatedMessage)
                  }
                  retained.insert(id)
              }
              return retained
          }

          '''
          if "private func ayuGramSaveDeletedMedia" not in source:
              if anchor not in source:
                  raise SystemExit("Could not find Swiftgram media deletion helper insertion point")
              source = source.replace(anchor, helper, 1)

          function_start = source.index("public func _internal_deleteMessages(")
          function_end = source.index("\nfunc _internal_deleteAllMessagesWithAuthor", function_start)
          delete_function = source[function_start:function_end]
          if "let retainedDeletedMessageIds = ayuGramRetainDeletedMessages(transaction: transaction, mediaBox: mediaBox, ids: ids)" not in delete_function:
              resource_cleanup = delete_function.index("    var resourceIds: [MediaResourceId] = []")
              insertion = """    let retainedDeletedMessageIds = ayuGramRetainDeletedMessages(transaction: transaction, mediaBox: mediaBox, ids: ids)
              let idsToDelete = ids.filter { !retainedDeletedMessageIds.contains($0) }
          """
              delete_function = delete_function[:resource_cleanup] + insertion + delete_function[resource_cleanup:]
          if delete_function.count("    for id in ids {") != 2:
              raise SystemExit("Unexpected _internal_deleteMessages structure; refusing unsafe retention patch")
          delete_function = delete_function.replace("    for id in ids {", "    for id in idsToDelete {")
          delete_function = delete_function.replace("transaction.deleteMessages(ids + replacementMessageIds,", "transaction.deleteMessages(idsToDelete + replacementMessageIds,", 1)
          source = source[:function_start] + delete_function + source[function_end:]

          path.write_text(source)

          update_path = Path("submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift")
          update_source = update_path.read_text()
          old_global_delete = """                var resourceIds: [MediaResourceId] = []
                transaction.deleteMessagesWithGlobalIds(ids, forEachMedia: { media in
                    addMessageMediaResourceIdsToRemove(media: media, resourceIds: &resourceIds)
                })"""
          new_global_delete = """                let resolvedMessageIds = transaction.messageIdsForGlobalIds(ids)
                let retainedDeletedMessageIds = ayuGramRetainDeletedMessages(transaction: transaction, mediaBox: mediaBox, ids: resolvedMessageIds)
                let messagesToDelete = resolvedMessageIds.filter { !retainedDeletedMessageIds.contains($0) }
                var resourceIds: [MediaResourceId] = []
                transaction.deleteMessages(messagesToDelete, forEachMedia: { media in
                    addMessageMediaResourceIdsToRemove(media: media, resourceIds: &resourceIds)
                })"""
          if old_global_delete in update_source:
              update_source = update_source.replace(old_global_delete, new_global_delete, 1)
          elif "ayuGramRetainDeletedMessages(transaction: transaction, mediaBox: mediaBox, ids: resolvedMessageIds)" not in update_source:
              # Current Swiftgram master performs global-ID deletions in the optimized
              # transaction-operation switch. Resolve IDs while the messages still exist,
              # retain eligible cloud messages, and delete only the remaining IDs.
              global_case = """            case let .DeleteMessagesWithGlobalIds(ids):
                  var resourceIds: [MediaResourceId] = []
                  transaction.deleteMessagesWithGlobalIds(ids, forEachMedia: { media in
                      addMessageMediaResourceIdsToRemove(media: media, resourceIds: &resourceIds)
                  })
                  if !resourceIds.isEmpty {
                      let _ = mediaBox.removeCachedResources(Array(Set(resourceIds)), force: true).start()
                  }
                  deletedMessageIds.append(contentsOf: ids.map { .global($0) })"""
              global_replacement = """            case let .DeleteMessagesWithGlobalIds(ids):
                  let resolvedMessageIds = transaction.messageIdsForGlobalIds(ids)
                  let retainedDeletedMessageIds = ayuGramRetainDeletedMessages(transaction: transaction, mediaBox: mediaBox, ids: resolvedMessageIds)
                  let messagesToDelete = resolvedMessageIds.filter { !retainedDeletedMessageIds.contains($0) }
                  var resourceIds: [MediaResourceId] = []
                  transaction.deleteMessages(messagesToDelete, forEachMedia: { media in
                      addMessageMediaResourceIdsToRemove(media: media, resourceIds: &resourceIds)
                  })
                  if !resourceIds.isEmpty {
                      let _ = mediaBox.removeCachedResources(Array(Set(resourceIds)), force: true).start()
                  }
                  deletedMessageIds.append(contentsOf: ids.map { .global($0) })"""
              import re
              global_pattern = r"(?ms)^\s*case let \.DeleteMessagesWithGlobalIds\(ids\):\n.*?^\s*deletedMessageIds\.append\(contentsOf: ids\.map \{ \.global\(\$0\) \}\)"
              global_match = re.search(global_pattern, update_source)
              if global_match:
                  update_source = update_source[:global_match.start()] + global_replacement + update_source[global_match.end():]
                  print("Patched Swiftgram's optimized global-ID deletion operation.")
              elif "ayuGramRetainDeletedMessages(transaction: transaction, mediaBox: mediaBox, ids: resolvedMessageIds)" in update_source:
                  print("Global-ID deletion hook already present.")
              else:
                  print("Global-ID deletion block has changed; skipping this secondary hook for now.")
          else:
              print("Global-ID deletion hook already present.")
          update_path.write_text(update_source)
          print("Adapted deletion flow to retain deleted cloud messages locally with a trash marker, while saving original text and cached media.")
          PY

      - name: Render retained-message trash marker beside timestamp
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # AyuGram Desktop keeps deleted-message data separate from the visible message.
          # On iOS, render the retention marker in the timestamp row rather than appending
          # an emoji to the user's message text.
          timestamp_files = [
              Path("submodules/TelegramUI/Components/Chat/ChatMessageBubbleItemNode/Sources/ChatMessageBubbleItemNode.swift"),
              Path("submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode/Sources/ChatMessageTextBubbleContentNode.swift"),
              Path("submodules/TelegramUI/Components/Chat/ChatMessageRichDataBubbleContentNode/Sources/ChatMessageRichDataBubbleContentNode.swift"),
              Path("submodules/TelegramUI/Components/Chat/ChatMessageMediaBubbleContentNode/Sources/ChatMessageMediaBubbleContentNode.swift"),
          ]
          for path in timestamp_files:
              source = path.read_text()
              needle = "let dateText = stringForMessageTimestampStatus("
              if needle in source:
                  lines = source.splitlines()
                  updated = []
                  count = 0
                  for line in lines:
                      if needle in line:
                          indent = line[:len(line) - len(line.lstrip())]
                          line = line.replace("let dateText =", "let ayuBaseDateText =", 1)
                          updated.append(line)
                          updated.append(indent + 'let dateText = (item.message.text == "🗑️" || item.message.text.hasSuffix(" 🗑️") || item.message.text.hasSuffix("\\n🗑️")) ? "🗑️ " + ayuBaseDateText : ayuBaseDateText')
                          count += 1
                      else:
                          updated.append(line)
                  if count:
                      path.write_text("\n".join(updated) + "\n")
                      print(f"Added timestamp marker to {path} ({count} call site(s))")
                  else:
                      raise SystemExit(f"Could not patch timestamp call in {path}")
              else:
                  raise SystemExit(f"Could not find timestamp call in {path}")

          # Remove the persistence sentinel from rendered message text. The timestamp
          # checks the stored original marker above, so the trash remains beside the time.
          path = timestamp_files[0]
          source = path.read_text()
          anchor = "                    var message = message\n"
          replacement = anchor + '''                    if message.text == "🗑️" {
                        message = message.withUpdatedText("")
                    } else if message.text.hasSuffix(" 🗑️") || message.text.hasSuffix("\\n🗑️") {
                        message = message.withUpdatedText(String(message.text.dropLast(2)))
                    }
          '''
          if anchor not in source:
              raise SystemExit("Could not find message-rendering anchor to hide sentinel")
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)
          print("Moved the visible trash marker out of message text and into timestamp rows.")
          PY


      - name: Fix manual Save action in long-press media menu
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift")
          source = path.read_text()
          start = source.find("        if resourceAvailable, !message.containsSecretMedia && !isCopyProtected {")
          end = source.find("        var downloadableMediaResourceInfos: [String] = []", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the media Save context-menu block; refusing to patch an unknown source layout.")

          replacement = r'''        if !message.containsSecretMedia && !isCopyProtected {
            var mediaReferences: [(reference: AnyMediaReference, isVideo: Bool, peerId: PeerId)] = []
            // The context-menu callback may contain every message in a grouped album.
            // Collect media from all supplied messages instead of saving only messages.first.
            for mediaMessage in messages {
                for media in mediaMessage.effectiveMedia {
                    if let image = media as? TelegramMediaImage, largestImageRepresentation(image.representations) != nil {
                        mediaReferences.append((ImageMediaReference.standalone(media: image).abstract, false, mediaMessage.id.peerId))
                    } else if let file = media as? TelegramMediaFile, file.isVideo {
                        mediaReferences.append((FileMediaReference.standalone(media: file).abstract, true, mediaMessage.id.peerId))
                    }
                }
            }

            if !mediaReferences.isEmpty {
                let allVideos = mediaReferences.allSatisfy { $0.isVideo }
                let saveTitle = allVideos
                    ? chatPresentationInterfaceState.strings.Gallery_SaveVideo
                    : chatPresentationInterfaceState.strings.Gallery_SaveImage
                actions.append(.action(ContextMenuActionItem(text: saveTitle, icon: { theme in
                    return generateTintedImage(image: UIImage(bundleImageName: "Chat/Context Menu/Save"), color: theme.actionSheet.primaryTextColor)
                }, action: { _, f in
                    let total = mediaReferences.count
                    var completedCount = 0
                    for mediaReference in mediaReferences {
                        let _ = (saveToCameraRoll(context: context, userLocation: .peer(mediaReference.peerId), mediaReference: mediaReference.reference)
                                 |> deliverOnMainQueue).startStandalone(completed: {
                            completedCount += 1
                            if completedCount == total {
                                Queue.mainQueue().after(0.2) {
                                    let presentationData = context.sharedContext.currentPresentationData.with { $0 }
                                    let savedText = allVideos
                                        ? presentationData.strings.Gallery_VideoSaved
                                        : presentationData.strings.Gallery_ImageSaved
                                    controllerInteraction.presentControllerInCurrent(UndoOverlayController(presentationData: presentationData, content: .mediaSaved(text: savedText), elevatedLayout: false, animateInAsReplacement: false, action: { _ in return true }), nil)
                                }
                            }
                        })
                    }
                    f(.default)
                })))
            }
                  }

          '''
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          print("Manual Save is now kept in the main long-press menu, is not hidden by the Swiftgram setting, and processes every image/video in an album.")
          PY

      - name: Keep the iOS 27-only Duo API compatible with runner Xcode
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("submodules/Display/Source/WindowContent.swift")
          source = path.read_text()
          pattern = r"    /// Multi-display devices only:.*?fileprivate var activeDivision: CGRect\? \{.*?\n    \}\n"
          replacement = "    /// Returns nil when built with an SDK that does not expose the iOS 27.1 multi-display API.\n    fileprivate var activeDivision: CGRect? {\n        return nil\n    }\n"
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              if "reservedRegions(kind: .division)" not in source:
                  print("No reservedRegions API found; compatibility patch not needed.")
              else:
                  raise SystemExit("Could not safely locate activeDivision in WindowContent.swift")
          else:
              path.write_text(updated)
              print("Disabled only the iOS 27.1 fold/active-division query for compatibility with Xcode 26.6.")
          PY

      - name: Avoid Swift optimizer crash on fallback Xcode
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build-system/Make/Make.py")
          source = path.read_text()
          needle = "            '--features=swift.opt_uses_wmo',"
          replacement = "            # CI workaround: Swift 6.3.3 crashed in SIL CopyPropagation with WMO on Xcode 26.6.\n            # '--features=swift.opt_uses_wmo',"
          if needle in source:
              path.write_text(source.replace(needle, replacement, 1))
              print("Disabled whole-module optimization for CI to avoid the observed Swift compiler crash.")
          elif "'--features=swift.opt_uses_wmo'," not in source:
              raise SystemExit("Could not find the expected Swift WMO flag in Make.py")
          else:
              print("WMO flag was already adjusted; leaving Make.py unchanged.")
          PY

      - name: Validate required build credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_ID" || { echo "::error::Add API_ID to repository Actions secrets"; exit 1; }
          test -n "$API_HASH" || { echo "::error::Add API_HASH to repository Actions secrets"; exit 1; }

      - name: Select Xcode required by merged source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED_XCODE="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          REQUESTED_PATH="/Applications/Xcode_${REQUESTED_XCODE}.app/Contents/Developer"
          if [ -d "$REQUESTED_PATH" ]; then
            SELECTED_PATH="$REQUESTED_PATH"
            echo "Using requested Xcode $REQUESTED_XCODE"
          else
            echo "Requested Xcode $REQUESTED_XCODE is not installed on this runner."
            echo "Installed Xcode versions:"
            ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null || true
            SELECTED_PATH="$(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort -V | tail -n 1)"
            if [ -z "$SELECTED_PATH" ]; then
              echo "::error::No Xcode installation found on runner."
              exit 1
            fi
            echo "Falling back to installed Xcode: $SELECTED_PATH"
          fi
          sudo xcode-select -s "$SELECTED_PATH"
          xcodebuild -version

      - name: Create app configuration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          template = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          template.update({
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": os.environ.get("TEAM_ID") or "C67CF9S4VU",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg"
          })
          Path("ayugramplus-ci-configuration.json").write_text(json.dumps(template, indent=2))
          PY

      # Reuse Bazel's downloaded external repositories across GitHub Actions runs.
      # This is a safe first cache layer; it avoids re-downloading dependencies without
      # restoring stale compiled outputs from a different Xcode/toolchain.
      - name: Cache Bazel external repositories
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost/cache/repos/v1
          key: bazel-repositories-macos-26-${{ hashFiles('source/versions.json', 'source/WORKSPACE', 'source/WORKSPACE.bazel', 'source/MODULE.bazel') }}
          restore-keys: |
            bazel-repositories-macos-26-

      - name: Build iOS IPA
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Use Swiftgram's bundle-ID-specific profiles for ph.telegra.Telegraph.
          # The generic fake profiles do not include aps-environment for this app ID.
          PROFILE_SOURCE="buildbox/fake-codesigning/profiles/appstore"
          test -d "$PROFILE_SOURCE" || { echo "::error::Missing appstore provisioning profiles at $PROFILE_SOURCE"; exit 1; }
          mkdir -p build-system/fake-codesigning/profiles
          cp "$PROFILE_SOURCE"/*.mobileprovision build-system/fake-codesigning/profiles/
          # Swiftgram's checked-in fake profiles expired in 2021. Refresh only their
          # CMS-wrapped plist expiry for CI's fake-signing build; this is NOT a real
          # Apple provisioning profile and the resulting IPA still needs proper signing
          # before normal device installation.
          python3 - <<'PY'
          import datetime, plistlib, subprocess, tempfile
          from pathlib import Path
          profiles = Path("build-system/fake-codesigning/profiles")
          with tempfile.TemporaryDirectory() as tmp:
              tmp = Path(tmp)
              cert, key = tmp / "fake-cert.pem", tmp / "fake-key.pem"
              subprocess.run([
                  "openssl", "req", "-x509", "-newkey", "rsa:2048", "-nodes",
                  "-keyout", str(key), "-out", str(cert), "-days", "3650",
                  "-subj", "/CN=CI Fake Provisioning Profile"
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              for profile_path in profiles.glob("*.mobileprovision"):
                  decoded = subprocess.run([
                      "openssl", "smime", "-inform", "der", "-verify",
                      "-noverify", "-in", str(profile_path)
                  ], check=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout
                  profile = plistlib.loads(decoded)
                  expiry = profile.get("ExpirationDate")
                  if not isinstance(expiry, datetime.datetime) or expiry < datetime.datetime.now(expiry.tzinfo):
                      profile["ExpirationDate"] = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(days=3650)
                      payload = tmp / "profile.plist"
                      payload.write_bytes(plistlib.dumps(profile, fmt=plistlib.FMT_XML))
                      subprocess.run([
                          "openssl", "smime", "-sign", "-binary", "-in", str(payload),
                          "-signer", str(cert), "-inkey", str(key), "-outform", "DER",
                          "-out", str(profile_path), "-nodetach"
                      ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      print(f"Refreshed expired CI-only fake profile: {profile_path.name}")
          PY
          echo "Checking matching provisioning profile APS entitlement..."
          python3 - <<'PY'
          import os, plistlib, subprocess, sys
          from pathlib import Path
          team = os.environ.get("TEAM_ID") or "C67CF9S4VU"
          bundle = "ph.telegra.Telegraph"
          found = False
          for path in Path("build-system/fake-codesigning/profiles").glob("*.mobileprovision"):
              decoded = subprocess.run(
                  ["openssl", "smime", "-inform", "der", "-verify", "-noverify", "-in", str(path)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
              ).stdout
              profile = plistlib.loads(decoded)
              ent = profile.get("Entitlements", {})
              app_id = ent.get("application-identifier", "")
              if app_id == f"{team}.{bundle}":
                  found = True
                  print(f"Matched profile: {path.name}; aps-environment={ent.get('aps-environment', '<missing>')}")
                  if "aps-environment" not in ent:
                      print("::error::Matching profile is missing aps-environment")
                      sys.exit(1)
          if not found:
              print(f"::error::No profile matches {team}.{bundle}")
              sys.exit(1)
          PY
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            --overrideXcodeVersion \
            build \
            --configurationPath="ayugramplus-ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p build/artifacts
          # Bazel output directories are often symlinks, so plain find does not
          # traverse bazel-bin. Prefer the exact target output, then follow links.
          ipa_path="bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -s "$ipa_path" ]; then
            ipa_path="$(find -L bazel-bin bazel-out -type f \( -name 'Swiftgram.ipa' -o -name 'Telegram.ipa' -o -name '*.ipa' \) -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$ipa_path" ] || [ ! -s "$ipa_path" ]; then
            echo "::error::Build completed, but no IPA was found. Workspace and Bazel outputs:"
            pwd
            ls -la
            ls -la bazel-bin/Telegram 2>/dev/null || true
            find -L bazel-bin bazel-out -type f -name '*.ipa' -print 2>/dev/null || true
            exit 1
          fi
          echo "Found IPA at: $ipa_path"
          cp "$ipa_path" build/artifacts/AyuGram-iOS-Plus-SideStore.ipa
          test -s build/artifacts/AyuGram-iOS-Plus-SideStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-SideStore-IPA
          path: source/build/artifacts/AyuGram-iOS-Plus-SideStore.ipa
          if-no-files-found: error
          retention-days: 7
