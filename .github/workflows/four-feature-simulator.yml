name: AyuGram iOS Plus — Four Feature Simulator Validation

on:
  workflow_dispatch:
    inputs:
      build_device_ipa:
        description: "Build the unsigned arm64 iPhone IPA for iLoader after simulator validation"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - feature/four-feature-integration
    paths:
      - '.github/workflows/four-feature-simulator.yml'
      - '.github/history-menu-smoke.py'
      - 'patches/**'
      - 'AyuGram/**'
      - 'submodules/**'
      - 'Scripts/**'

# Maximum allowed GitHub Actions job duration: 360 minutes.
# History hardening v2
# Force CI on source-level hardening fixes

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    # Full simulator/device packaging is manual-only; source checks must never start IPA packaging on push.
    # Telegram-iOS baseline builds sim_arm64; use Apple Silicon runner so Simulator can install it directly.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v5

      - name: Restore Bazel build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/telegram-bazel-cache
            ~/.cache/bazel/repository
          # Each run saves its new partial/full Bazel cache under a unique key.
          # Restore the newest prior cache so failed compiles still speed up the next run.
          key: ${{ runner.os }}-telegram-bazel-eb5ae67a32c6-xcode27-repository-v1-${{ hashFiles('patches/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-telegram-bazel-eb5ae67a32c6-xcode27-repository-v1-${{ hashFiles('patches/**') }}-
            ${{ runner.os }}-telegram-bazel-eb5ae67a32c6-
          save-always: true

      - name: Select Xcode 27 and verify iOS 27 runtime
        run: |
          xcodebuild -version
          xcode-select -p
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK version: $SDK_VERSION"
          case "$SDK_VERSION" in
            27.*) ;;
            *) echo "Expected an iOS 27 SDK, got $SDK_VERSION" >&2; exit 1 ;;
          esac
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simulator-runtimes.txt"
          grep -q "iOS 27" "$RUNNER_TEMP/simulator-runtimes.txt" || {
            echo "An iOS 27 Simulator runtime is required for the launch regression test." >&2
            exit 1
          }
          if ! xcrun --find metal >/dev/null 2>&1; then
            echo "Metal toolchain missing; downloading it..."
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal

      - name: Install Bazelisk
        run: |
          brew list bazelisk >/dev/null 2>&1 || brew install bazelisk
          command -v bazelisk
          USE_BAZEL_VERSION=8.4.2 bazelisk --version

      - name: Validate required Telegram API secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing repository secret TELEGRAM_API_ID"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing repository secret TELEGRAM_API_HASH"; exit 1; }
          case "$TELEGRAM_API_ID" in
            *[!0-9]*) echo "TELEGRAM_API_ID must be numeric"; exit 1 ;;
          esac
          echo "Telegram API credentials are present."

      - name: Clone Telegram-iOS baseline
        run: |
          # Clone the baseline first, then initialize submodules individually.
          # The pinned Telegram-iOS tree references an rlottie commit that is no
          # longer fetchable from TelegramMessenger/rlottie (upload-pack: not our ref).
          git clone https://github.com/Swiftgram/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout --detach eb5ae67a32c6e8b936ca0e875f19f99251112f17
          git submodule sync --recursive

          while IFS= read -r module_entry; do
            module_path="${module_entry#* }"
            if [ "$module_path" = "submodules/rlottie/rlottie" ]; then
              echo "Skipping unavailable pinned rlottie gitlink: $module_path"
              continue
            fi
            echo "Initializing submodule: $module_path"
            initialized=0
            for attempt in 1 2 3; do
              if git submodule update --init --recursive --jobs 4 -- "$module_path"; then
                initialized=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Submodule fetch failed for $module_path (attempt $attempt/3); retrying in 5 seconds..."
                sleep 5
              fi
            done
            if [ "$initialized" -ne 1 ]; then
              echo "::error::Unable to initialize submodule $module_path after 3 attempts"
              exit 1
            fi
          done < <(git config -f .gitmodules --get-regexp path)

          # Use the latest commit that is actually present in the official rlottie
          # repository, rather than the unreachable gitlink above.
          rm -rf submodules/rlottie/rlottie
          git clone https://github.com/TelegramMessenger/rlottie.git submodules/rlottie/rlottie
          git -C submodules/rlottie/rlottie checkout --detach 67f103bc8b625f2a4a9e94f1d8c7bd84c5a08d1d
          echo "rlottie revision: $(git -C submodules/rlottie/rlottie rev-parse HEAD)"

      - name: Check Telegram baseline and align temporary Xcode metadata
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("versions.json")
          v = json.loads(path.read_text(encoding="utf-8"))
          assert v["app"] == "12.9.2", v
          xcode_output = subprocess.check_output(["xcodebuild", "-version"], text=True)
          xcode_line = next((line for line in xcode_output.splitlines() if line.startswith("Xcode ")), None)
          if not xcode_line:
              raise SystemExit("Could not read the active Xcode version: " + xcode_output)
          active_xcode = xcode_line.split()[1]
          if int(active_xcode.split(".")[0]) < 27:
              raise SystemExit("The iOS 27 scene regression requires Xcode 27 or later, got " + active_xcode)
          original_xcode = v["xcode"]
          v["xcode"] = active_xcode
          path.write_text(json.dumps(v, indent=2), encoding="utf-8")
          print("Pinned Telegram baseline:", v["app"], "original Xcode metadata:", original_xcode, "runner Xcode:", active_xcode)
          PY

      - name: Validate and apply AyuGram patch
        run: |
          cp patches/ayugram-1.3.0.patch telegram-ios/ayugram-1.3.0.patch
          cd telegram-ios
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("ayugram-1.3.0.patch").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^diff --git ", patch)
          applied = []

          for raw in sections[1:]:
              lines = raw.splitlines()
              header = lines[0]
              m = re.match(r"a/(.+?) b/(.+)$", header)
              if not m:
                  raise SystemExit(f"Bad diff header: {header!r}")
              target = Path(m.group(2))
              meta = lines[1:8]
              is_new = any(x.startswith("new file mode ") for x in meta)
              is_deleted = any(x.startswith("deleted file mode ") for x in meta)

              hunks = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("@@ "):
                      hm = re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", lines[i])
                      if not hm:
                          raise SystemExit(f"Bad hunk header in {target}: {lines[i]!r}")
                      old_start = int(hm.group(1))
                      body = []
                      i += 1
                      while i < len(lines) and not lines[i].startswith("@@ ") and not lines[i].startswith("diff --git "):
                          if not lines[i].startswith("\\ No newline at end of file"):
                              body.append(lines[i])
                          i += 1
                      hunks.append((old_start, body))
                  else:
                      i += 1

              if is_deleted:
                  if target.exists():
                      target.unlink()
                  applied.append(str(target))
                  continue

              if is_new:
                  new_lines = []
                  for line in hunks[0][1] if hunks else []:
                      if line.startswith("+") or line.startswith(" "):
                          new_lines.append(line[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("\n".join(new_lines) + ("\n" if new_lines else ""), encoding="utf-8")
                  applied.append(str(target))
                  continue

              if not target.exists():
                  raise SystemExit(f"Target file missing: {target}")
              current = target.read_text(encoding="utf-8").splitlines()
              cursor = 0

              for old_line, body in hunks:
                  old_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("-")]
                  new_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("+")]

                  if old_lines:
                      hint = max(0, old_line - 1)
                      positions = [hint] + list(range(cursor, max(cursor, len(current) - len(old_lines) + 1)))
                      seen = set()
                      found = None
                      for pos in positions:
                          if pos in seen:
                              continue
                          seen.add(pos)
                          if pos + len(old_lines) <= len(current) and current[pos:pos + len(old_lines)] == old_lines:
                              found = pos
                              break
                      if found is None:
                          raise SystemExit(f"Context mismatch applying {target} near old line {old_line}")
                      current[found:found + len(old_lines)] = new_lines
                      cursor = found + len(new_lines)
                  else:
                      insert_at = max(0, min(len(current), old_line - 1))
                      current[insert_at:insert_at] = new_lines
                      cursor = insert_at + len(new_lines)

              target.write_text("\n".join(current) + ("\n" if current else ""), encoding="utf-8")
              applied.append(str(target))

          print("Applied", len(applied), "diff sections")
          for path in applied:
              print("  ", path)
          PY

          # Apply the same History model/UI/storage hardening used by the
          # compatibility workflow before compiling AyuGramIOS. The base patch
          # intentionally carries the portable model; these passes add sender
          # and deletion-time metadata consumed by the media archive.
          python3 ../Scripts/harden_ayugram_history.py
          python3 ../Scripts/harden_four_feature_storage.py
          python3 ../Scripts/apply_four_feature_ui.py
          python3 ../Scripts/apply_ios27_scene_lifecycle.py

          # Comprehensive AyuGram runtime smoke-test hook (UI + feature verification).
          python3 ../Scripts/inject_ayugram_history_test.py
          python3 "$GITHUB_WORKSPACE/.github/history-menu-smoke.py"

          git diff --check

      - name: Prepare portable entitlements for iLoader signing
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path("Telegram/BUILD")
          source = build.read_text(encoding="utf-8")
          pattern = r'(?m)^\s*<key>application-identifier</key>\n\s*<string>\{telegram_team_id\}\.\{telegram_bundle_id\}</string>\n'
          source, count = re.subn(pattern, "", source, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one generated placeholder application-identifier entitlement; found {count}")
          build.write_text(source, encoding="utf-8")
          assert "<key>application-identifier</key>" not in source
          assert "<string>group.{telegram_bundle_id}</string>" in source
          print("Removed placeholder Team ID application-identifier; kept the AyuGram app-group entitlement.")
          print("The signing tool must supply application-identifier from its real provisioning profile.")
          PY

      - name: Verify AyuGram feature integrations
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch_files = list(Path("submodules").rglob("*.swift"))
          text = "\\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in patch_files)

          required = {
              "Ghost Mode packet gate": "AyuGramGhostGate.shouldSend",
              "Deleted-message capture": "AyuGramCaptureService.captureDeleted",
              "Edit-history capture": "AyuGramCaptureService.captureEdited",
              "Regex filter gate": "AyuGramRuntime.shouldFilterMessage",
              "Media archive": "AyuGramMediaArchive.archive",
              "Postbox history": "AyuGramPostboxHistoryStore",
              "Message Shot renderer": "AyuMessageShotRenderer.render",
              "Zalgo/bidi sanitizer": "AyuTextSanitizer.filterZalgo",
              "Translation service": "class AyuGramTranslationService",
              "AyuGram Settings core": "struct AyuSettings",
              "History screen": "ayuGramHistoryScreen(context: context, dialogID:",
              "Manual AyuGram Save": "AyuGramCaptureService.saveNow(",
              "Automatic History Postbox persistence": "AyuGramPostboxHistoryStore.appendDeleted",
          }

          missing = [name for name, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit("Missing AyuGram integrations: " + ", ".join(missing))

          print("Verified AyuGram integrations:", len(required))
          PY

      - name: Fix binary-output decoding in Telegram build helper
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-system/Make/BuildEnvironment.py")
          s = p.read_text(encoding="utf-8")
          old = "    output_string = output_data.decode('utf-8')"
          new = "    output_string = output_data.decode('utf-8', errors='replace')"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          elif new not in s:
              raise SystemExit("Expected BuildEnvironment.py decode line was not found")
          PY

      - name: Apply Xcode 27 Swift weak-capture compatibility fix
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("submodules/TelegramUI/Components/SubcodecAnimationCacheImpl/Sources/SubcodecAnimationCacheImpl.swift")
          source = path.read_text(encoding="utf-8")
          old = "        let disposable = MetaDisposable()\n        self.impl.with { impl in\n            disposable.set(impl.get(sourceId: sourceId, size: size, fetch: fetch, updateResult: { [weak self] result in"
          new = "        let disposable = MetaDisposable()\n        let implementation = self.impl\n        implementation.with { [weak self] impl in\n            disposable.set(impl.get(sourceId: sourceId, size: size, fetch: fetch, updateResult: { [weak self] result in"
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one fetchIfNeeded weak-capture block; found {source.count(old)}")
          source = source.replace(old, new, 1)
          method_start = source.index("    public func fetchIfNeeded(")
          method = source[method_start:]
          if "self.impl.with" in method or "let implementation = self.impl" not in method or "implementation.with { [weak self] impl in" not in method:
              raise SystemExit("Xcode 27 fetchIfNeeded weak outer capture fix did not apply cleanly")
          path.write_text(source, encoding="utf-8")
          print("Applied Xcode 27 capture fix specifically to fetchIfNeeded.")
          PY

          # Xcode 27 diagnoses nested weak captures when the enclosing
          # DispatchQueue closure implicitly captures self strongly. Make that
          # existing strong ownership explicit; behavior and lifetime are unchanged.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramAudio/Sources/ManagedAudioSession.swift")
          source = path.read_text(encoding="utf-8")
          lines = source.splitlines(keepends=True)

          def is_holder_registration(index):
              return (
                  lines[index].strip() in ("queue.async {", "queue.async { [self] in")
                  and index + 1 < len(lines)
                  and lines[index + 1].lstrip().startswith("self.holders.append(HolderRecord")
              )

          pending = [i for i in range(len(lines) - 1) if lines[i].strip() == "queue.async {" and is_holder_registration(i)]
          already = [i for i in range(len(lines) - 1) if lines[i].strip() == "queue.async { [self] in" and is_holder_registration(i)]

          if len(pending) == 1 and not already:
              i = pending[0]
              lines[i] = lines[i].replace("queue.async {", "queue.async { [self] in", 1)
              source = "".join(lines)
              path.write_text(source, encoding="utf-8")
              print("Applied explicit [self] to the unique holder-registration queue closure.")
          elif not pending and len(already) == 1:
              print("ManagedAudioSession explicit strong capture already applied.")
          else:
              raise SystemExit(
                  f"Expected exactly one holder-registration closure; "
                  f"found pending={len(pending)}, already-fixed={len(already)}"
              )

          verified = path.read_text(encoding="utf-8").splitlines()
          verified_matches = [
              i for i in range(len(verified) - 1)
              if verified[i].strip() == "queue.async { [self] in"
              and verified[i + 1].lstrip().startswith("self.holders.append(HolderRecord")
          ]
          if len(verified_matches) != 1:
              raise SystemExit("ManagedAudioSession Xcode 27 explicit-capture verification failed.")
          PY
          # Xcode 27 flags nested weak captures when the surrounding closure
          # implicitly captures the same object strongly. Make only those existing
          # strong captures explicit; this preserves the existing ownership behavior.
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  "submodules/Display/Source/GlobalOverlayPresentationContext.swift",
                  "self.presentationDisposables.add(controllerReady.start(next: { [weak self] _ in",
                  "self.presentationDisposables.add(controllerReady.start(next: { [weak self, controller] _ in",
              ),
              (
                  "submodules/Display/Source/ListView.swift",
                  "        state.fixScrollPosition(itemsCount)\n        \n        let actions = {",
                  "        state.fixScrollPosition(itemsCount)\n        \n        let actions = { [self] in",
              ),
              (
                  "submodules/Display/Source/ListViewTransactionQueue.swift",
                  "        Queue.mainQueue().async {\n            self.transactionCompleted()",
                  "        Queue.mainQueue().async { [self] in\n            self.transactionCompleted()",
              ),
              (
                  "submodules/Display/Source/PresentationContext.swift",
                  "            }).start(next: { [weak self] _ in",
                  "            }).start(next: { [weak self, controller] _ in",
              ),
          ]

          for relative_path, old, new in patches:
              file_path = Path(relative_path)
              source = file_path.read_text(encoding="utf-8")
              old_count = source.count(old)
              new_count = source.count(new)
              if old_count == 1 and new_count == 0:
                  source = source.replace(old, new, 1)
                  file_path.write_text(source, encoding="utf-8")
                  print(f"Applied Xcode 27 capture fix: {relative_path}")
              elif old_count == 0 and new_count == 1:
                  print(f"Xcode 27 capture fix already applied: {relative_path}")
              else:
                  raise SystemExit(
                      f"Unsafe Xcode 27 capture patch for {relative_path}: "
                      f"old={old_count}, already_fixed={new_count}"
                  )

          for relative_path, old, new in patches:
              source = Path(relative_path).read_text(encoding="utf-8")
              new_count = source.count(new)
              if new_count != 1:
                  raise SystemExit(
                      f"Xcode 27 capture patch verification failed: "
                      f"{relative_path} expected one patched anchor, found {new_count}"
                  )
          print("Verified four Display capture fixes.")
          PY

          # Xcode 27 diagnoses nested weak captures when the enclosing animation
          # closures implicitly retain self. Patch only plain implicit-capture
          # closures; preserve neighboring closures that already use [weak self].
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              ("submodules/InvisibleInkDustNode/Sources/InvisibleInkDustNode.swift", 1),
              ("submodules/InvisibleInkDustNode/Sources/MediaDustNode.swift", 1),
          ]
          anchor = "Queue.mainQueue().after(0.1 * UIView.animationDurationFactor()) {"
          original_line = anchor + chr(10)
          replacement_line = anchor + " [self] in" + chr(10)

          for relative_path, expected in patches:
              path = Path(relative_path)
              source = path.read_text(encoding="utf-8")
              old_count = source.count(original_line)
              new_count = source.count(replacement_line)

              if old_count == expected and new_count == 0:
                  source = source.replace(original_line, replacement_line)
                  path.write_text(source, encoding="utf-8")
                  print(f"Applied explicit outer capture ({expected}): {relative_path}")
              elif old_count == 0 and new_count == expected:
                  print(f"Explicit outer capture already applied ({expected}): {relative_path}")
              else:
                  raise SystemExit(
                      f"Unsafe InvisibleInk capture patch for {relative_path}: "
                      f"expected={expected}, old={old_count}, already_fixed={new_count}"
                  )

          for relative_path, expected in patches:
              source = Path(relative_path).read_text(encoding="utf-8")
              if source.count(original_line) != 0 or source.count(replacement_line) != expected:
                  raise SystemExit(
                      f"InvisibleInk capture verification failed for {relative_path}; "
                      f"expected exactly {expected} explicit plain-closure captures"
                  )
          print("Verified both plain implicit-capture fixes; existing weak captures were preserved.")
          PY
          # Xcode 27 diagnoses a weak nested capture when the enclosing add
          # closure already captures the same viewContext strongly. Give the
          # nested weak capture an explicit value binding without changing lifetime.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/ComponentFlow/Source/Base/CombinedComponent.swift")
          source = path.read_text(encoding="utf-8")
          old = "erasedState._updated = { [weak viewContext] transition, isLocal in"
          new = "erasedState._updated = { [weak viewContext = viewContext] transition, isLocal in"
          old_count = source.count(old)
          new_count = source.count(new)

          if old_count == 1 and new_count == 0:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
              print("Applied explicit weak viewContext capture in CombinedComponent.")
          elif old_count == 0 and new_count == 1:
              print("CombinedComponent weak viewContext capture already fixed.")
          else:
              raise SystemExit(
                  f"Unsafe CombinedComponent capture patch: old={old_count}, fixed={new_count}"
              )

          verified = path.read_text(encoding="utf-8")
          if verified.count(new) != 1:
              raise SystemExit("CombinedComponent explicit weak capture verification failed.")
          PY
          # Xcode 27's ImplicitStrongCapture diagnostic also applies to nested
          # weak captures in Postbox. Explicitly rebind only the compiler-reported
          # capture items; their weak ownership and cancellation behavior stay intact.
          python3 - <<'PY'
          from pathlib import Path

          patches = {
              "submodules/Postbox/Sources/MediaBox.swift": [
                  (428, "[weak statusContext]", "[weak statusContext = statusContext]"),
                  (437, "[weak statusContext]", "[weak statusContext = statusContext]"),
                  (918, "[weak self,", "[weak self = self,"),
                  (1076, "[weak self,", "[weak self = self,"),
                  (1259, "[weak self,", "[weak self = self,"),
              ],
              "submodules/Postbox/Sources/Postbox.swift": [
                  (3757, "[weak self]", "[weak self = self]"),
                  (3779, "[weak self]", "[weak self = self]"),
                  (3904, "[weak self]", "[weak self = self]"),
                  (3926, "[weak self]", "[weak self = self]"),
                  (3958, "[weak self]", "[weak self = self]"),
                  (3994, "[weak self]", "[weak self = self]"),
                  (4082, "[weak self]", "[weak self = self]"),
                  (4105, "[weak self]", "[weak self = self]"),
                  (4127, "[weak self]", "[weak self = self]"),
                  (4178, "[weak self]", "[weak self = self]"),
                  (4200, "[weak self]", "[weak self = self]"),
                  (4226, "[weak self]", "[weak self = self]"),
                  (4324, "[weak self]", "[weak self = self]"),
                  (4608, "[weak self]", "[weak self = self]"),
              ],
          }

          for relative_path, line_patches in patches.items():
              path = Path(relative_path)
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              for line_number, old, new in line_patches:
                  index = line_number - 1
                  if index >= len(lines):
                      raise SystemExit(f"{relative_path}:{line_number} is outside the file")
                  line = lines[index]
                  if line.count(old) == 1 and new not in line:
                      lines[index] = line.replace(old, new, 1)
                  elif line.count(new) == 1 and old not in line:
                      pass
                  else:
                      raise SystemExit(
                          f"Unsafe capture patch at {relative_path}:{line_number}: "
                          f"expected exactly one of old/new anchor"
                      )

              path.write_text("".join(lines), encoding="utf-8")
              verified = path.read_text(encoding="utf-8").splitlines()
              for line_number, old, new in line_patches:
                  line = verified[line_number - 1]
                  if line.count(new) != 1 or old in line:
                      raise SystemExit(
                          f"Capture verification failed at {relative_path}:{line_number}"
                      )
              print(f"Verified {len(line_patches)} weak capture rebinding(s): {relative_path}")
          print("Verified all 19 Postbox Xcode 27 capture fixes.")
          PY
          # Xcode 27 reports nested weak captures when an enclosing TelegramCore
          # closure already captures the same value strongly. Rebind only the
          # compiler-reported capture items explicitly; they remain weak.
          python3 - <<'PY'
          from pathlib import Path

          patches = {
              "submodules/TelegramCore/Sources/Account/Account.swift": [
                  ("postbox.mediaBox.fetchResource = { [weak postbox] resource", "postbox.mediaBox.fetchResource = { [weak postbox = postbox] resource", 1),
