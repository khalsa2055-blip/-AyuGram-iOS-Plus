      - name: Create simulator build configuration
        working-directory: telegram-ios
        env:
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          src = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          src["bundle_id"] = "org.ayugram.iosplus"
          src["api_id"] = os.environ["TELEGRAM_API_ID"]
          src["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          src["team_id"] = "0000000000"
          src["is_internal_build"] = "true"
          src["is_appstore_build"] = "false"
          Path("build-system/ayugram-ci-configuration.json").write_text(
              json.dumps(src, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build Telegram for iOS Simulator
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          # Simulator-only builds must not resolve Apple provisioning profiles or app extensions.
          # Restore the baseline .bazelrc automatically after the build, including on failure.
          bazelrc_backup="$(mktemp)"
          cp .bazelrc "$bazelrc_backup"
          restore_bazelrc() {
            cp "$bazelrc_backup" .bazelrc
            rm -f "$bazelrc_backup"
          }
          trap restore_bazelrc EXIT
          cat >> .bazelrc <<'BAZELRC'
          build --//Telegram:disableProvisioningProfiles
          build --//Telegram:disableExtensions
          # Xcode 27 libc++ reports legacy deployment-target support through
          # Clang's -W#warnings diagnostic. Keep that warning visible but prevent
          # the target's general -Werror from promoting this one diagnostic.
          # All other warning groups remain errors.
          build --cxxopt='-Wno-error=#warnings'
          BAZELRC

          echo "Simulator build (single cached attempt)"
          USE_BAZEL_VERSION=8.4.2 python3 build-system/Make/Make.py \
            --bazel="$(command -v bazelisk)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber=200084 \
            --configuration=debug_sim_arm64

      - name: Smoke-test app in iPhone Simulator
        working-directory: telegram-ios
        run: |
          set -euo pipefail

          # Always exercise the app on an iOS 27 iPhone Simulator. A previously booted
          # iOS 26 simulator must not silently turn this into an older lifecycle test.
          DEVICE_UDID="$(python3 - <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True
          ))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS-27" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, device.get("name", ""), device["udid"]))
          if not candidates:
              sys.exit("No available iOS 27 iPhone Simulator was found.")
          candidates.sort()
          print(candidates[-1][2])
          PY
          )"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl list devices | grep "$DEVICE_UDID"

          ipa="bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$ipa" ]; then
            # bazel-bin is a symlink; find must follow it on macOS runners.
            ipa=$(find -L bazel-bin -type f -name "*.ipa" -print -quit || true)
          fi
          test -n "$ipa" && test -f "$ipa"

          rm -rf ci-artifacts/smoke
          mkdir -p ci-artifacts/smoke
          unzip -q -o "$ipa" -d ci-artifacts/smoke
          app=$(find ci-artifacts/smoke/Payload -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$app" && test -d "$app"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test "$bundle_id" = "org.ayugram.iosplus"
          export APP_PATH="$app"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = plistlib.loads((Path(__import__("os").environ["APP_PATH"]) / "Info.plist").read_bytes())
          assert info.get("UIFileSharingEnabled") is True, info.get("UIFileSharingEnabled")
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True, info.get("LSSupportsOpeningDocumentsInPlace")
          print("Final app Documents/Files flags: enabled")
          manifest = info.get("UIApplicationSceneManifest")
          assert isinstance(manifest, dict), "Missing UIApplicationSceneManifest"
          assert manifest.get("UIApplicationSupportsMultipleScenes") is False
          role = manifest.get("UISceneConfigurations", {}).get("UIWindowSceneSessionRoleApplication", [])
          assert any(item.get("UISceneDelegateClassName") == "SceneDelegate" for item in role), role
          print("iOS 27 scene manifest points to SceneDelegate.")
          PY


          main_binary="$app/$executable"
          lipo "$main_binary" -verify_arch arm64
          if lipo "$main_binary" -verify_arch x86_64 >/dev/null 2>&1; then
            echo "Unexpected x86_64 simulator slice detected."
            exit 1
          fi

          # Remove the app first so an old Documents container cannot make a stale
          # marker/report look like a successful test on a new launch.
          xcrun simctl uninstall "$DEVICE_UDID" "$bundle_id" >/dev/null 2>&1 || true
          xcrun simctl install "$DEVICE_UDID" "$app"

          # Capture a clean, ordinary launch before any AyuGram test arguments.
          # This distinguishes a real app-startup/UI failure from the feature harness.
          mkdir -p ci-artifacts/smoke
          set +e
          normal_launch=$(xcrun simctl launch --terminate-running-process "$DEVICE_UDID" "$bundle_id" 2>&1)
          normal_launch_rc=$?
          set -e
          echo "Ordinary launch result: $normal_launch"
          echo "Capturing startup diagnostics for executable: $executable"
          if [ "$normal_launch_rc" -ne 0 ]; then
            xcrun simctl spawn "$DEVICE_UDID" log show --last 2m --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tail -300 || true
            exit "$normal_launch_rc"
          fi
          sleep 15
          xcrun simctl io "$DEVICE_UDID" screenshot ci-artifacts/smoke/AyuGram-Normal-Launch.png
          test -s ci-artifacts/smoke/AyuGram-Normal-Launch.png
          xcrun simctl spawn "$DEVICE_UDID" log show --last 30s --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tee ci-artifacts/smoke/AyuGram-Normal-Launch.log | tail -180
          xcrun simctl terminate "$DEVICE_UDID" "$bundle_id" >/dev/null 2>&1 || true
          APP_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_UDID" "$bundle_id" data)
          DOCUMENTS="$APP_CONTAINER/Documents"
          mkdir -p "$DOCUMENTS"
          rm -f "$DOCUMENTS/AyuGramHistoryMenuHarnessReady.txt" \
                "$DOCUMENTS/AyuGramHistoryListHarnessReady.txt" \
                "$DOCUMENTS/AyuGramHistoryListSmokeReport.json"
          
          # Run the actual in-app save implementation against a two-file album and
          # a text-only message before the separate unauthenticated History UI fixture.
