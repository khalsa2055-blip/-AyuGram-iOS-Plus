          source = make.read_text(encoding="utf-8")
          lines = source.splitlines()
          anchor = "bazel_command_line.set_custom_target(arguments.target)"
          for index, line in enumerate(lines):
              if line.strip() == anchor:
                  indent = line[:len(line) - len(line.lstrip())]
                  additions = [
                      indent + "if arguments.configuration in ('debug_sim_arm64', 'release_sim_arm64', 'debug_arm64', 'release_arm64'):",
                      indent + "    bazel_command_line.set_disable_provisioning_profiles()",
                      indent + "if arguments.configuration in ('debug_arm64', 'release_arm64'):",
                      indent + "    # Leave device code signing to iLoader on the user's PC.",
                      indent + "    bazel_command_line.common_args.append('--features=disable_legacy_signing')",
                  ]
                  if additions[0] not in lines[index + 1:index + 6]:
                      lines[index + 1:index + 1] = additions
                  break
          else:
              raise SystemExit("Make.py build hook anchor was not found")
          make.write_text(chr(10).join(lines) + chr(10), encoding="utf-8")

          patched = profile_partial.read_text(encoding="utf-8")
          assert "return struct(bundle_files = [])" in patched
          assert "disable_legacy_signing" in make.read_text(encoding="utf-8")
          print("Configured device IPA packaging without Apple signing assets; iLoader will sign it.")
          PY

      - name: Build and verify arm64 iPhone IPA
        if: success() && github.event_name == 'workflow_dispatch' && inputs.build_device_ipa # Require explicit manual opt-in.
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          echo "Building the device-only arm64 target using the warmed Bazel cache."
          USE_BAZEL_VERSION=8.4.2 python3 build-system/Make/Make.py \
            --bazel="$(command -v bazelisk)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --overrideXcodeVersion \
            --xcodeManagedCodesigning \
            --buildNumber=200084 \
            --configuration=release_arm64

          ipa="bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$ipa" ]; then
            ipa=$(find -L bazel-bin -type f -name "*.ipa" -print -quit || true)
          fi
          test -n "$ipa" && test -f "$ipa"

          rm -rf ci-artifacts/device-extracted
          mkdir -p ci-artifacts/device-extracted
          unzip -q -o "$ipa" -d ci-artifacts/device-extracted
          app=$(find ci-artifacts/device-extracted/Payload -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$app" && test -d "$app"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test "$bundle_id" = "org.ayugram.iosplus"
          main_binary="$app/$executable"
          lipo "$main_binary" -verify_arch arm64
          archs=$(lipo -archs "$main_binary")
          echo "Device binary architectures: $archs"
          vtool -show-build "$main_binary" | tee ci-artifacts/device-build-platform.txt
          grep -Eq 'platform IOS([[:space:]]|$)' ci-artifacts/device-build-platform.txt
          if grep -q 'platform IOSSIMULATOR' ci-artifacts/device-build-platform.txt; then
            echo "Simulator binary was produced instead of an iPhone device binary." >&2
            exit 1
          fi

          if [ -e "$app/embedded.mobileprovision" ]; then
            echo "Unexpected embedded provisioning profile in the device IPA." >&2
            exit 1
          fi
          if codesign -dv --verbose=4 "$app" > "$RUNNER_TEMP/ayugram-device-codesign.txt" 2>&1; then
            cp "$RUNNER_TEMP/ayugram-device-codesign.txt" ci-artifacts/device-codesign.txt
            echo "The app bundle carries a code signature; inspect device-codesign.txt."
          else
            echo "The app bundle is unsigned. It must be signed by iLoader or another signing tool before installation."
            echo "unsigned; no embedded provisioning profile" > ci-artifacts/device-codesign.txt
          fi

          cp "$ipa" ci-artifacts/AyuGram-iOS-Plus-device-arm64.ipa
          rm -rf ci-artifacts/device-extracted
          ls -lh ci-artifacts/AyuGram-iOS-Plus-device-arm64.ipa

      - name: Upload arm64 device IPA
        if: success() && github.event_name == 'workflow_dispatch' && inputs.build_device_ipa # Require explicit manual opt-in.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-device-arm64-${{ github.run_number }}
          path: telegram-ios/ci-artifacts/AyuGram-iOS-Plus-device-arm64.ipa
          if-no-files-found: error

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-four-feature-screenshots-${{ github.run_number }}
          path: |
            telegram-ios/ci-artifacts/smoke/AyuGram-History-*.png
            telegram-ios/ci-artifacts/smoke/AyuGram-Normal-Launch.png
            telegram-ios/ci-artifacts/smoke/AyuGram-Normal-Launch.log
          if-no-files-found: warn

      - name: Upload simulator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-four-feature-simulator-${{ github.run_number }}
          path: telegram-ios/ci-artifacts
          if-no-files-found: error
