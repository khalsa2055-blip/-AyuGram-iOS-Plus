              )

          helper = """private final class ChatMediaEmptyInputView: UIView, UIInputViewAudioFeedback {
              var enableInputClicksWhenVisible: Bool {
                  return true
              }
          }

          """
          anchor = "final class VideoNavigationControllerDropContentItem: NavigationControllerDropContentItem {"
