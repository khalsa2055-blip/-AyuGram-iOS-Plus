              "submodules/TelegramUI/Components/Chat/ChatMessageWebpageBubbleContentNode/Sources/ChatMessageWebpageBubbleContentNode.swift": {
                  610: "self", 624: "contentNode"
              },
              "submodules/TelegramUI/Components/Chat/ChatMessageEventLogPreviousDescriptionContentNode/Sources/ChatMessageEventLogPreviousDescriptionContentNode.swift": {64: "self"},
              "submodules/TelegramUI/Components/Chat/ChatMessageEventLogPreviousLinkContentNode/Sources/ChatMessageEventLogPreviousLinkContentNode.swift": {59: "self"},
              "submodules/TelegramUI/Components/Chat/ChatMessageEventLogPreviousMessageContentNode/Sources/ChatMessageEventLogPreviousMessageContentNode.swift": {64: "self"},
              "submodules/TelegramUI/Components/Chat/ChatMessageGameBubbleContentNode/Sources/ChatMessageGameBubbleContentNode.swift": {92: "self"},
              "submodules/TelegramUI/Components/Chat/ChatMessageInvoiceBubbleContentNode/Sources/ChatMessageInvoiceBubbleContentNode.swift": {88: "self"},
              "submodules/TelegramUI/Components/ComposePollScreen/Sources/ComposePollScreen.swift": {
                  818: "inputMediaNode", 1695: "self", 1741: "self",
                  1757: "self", 1777: "self", 1789: "self", 1792: "self"
              },
          }

          total = 0
          for filename, entries in fixes.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              for line_number, name in entries.items():
                  index = line_number - 1
                  if index >= len(lines):
                      raise SystemExit(f"Line moved in {filename}:{line_number}")
                  # Match a weak capture whether it is the only item
                  # ([weak self]) or part of a compound list
                  # ([weak self, weak searchDisplayController]).
                  pattern = rf"\bweak\s+{re.escape(name)}(?=\s*(?:,|\]))"
                  alias = f"weak {name} = {name}"
                  count = len(list(re.finditer(pattern, lines[index])))
                  if count == 1:
                      lines[index] = re.sub(pattern, lambda _: alias, lines[index], count=1)
                      total += 1
                  elif count == 0 and alias in lines[index]:
                      pass
                  else:
                      raise SystemExit(
                          f"Unexpected weak capture at {filename}:{line_number}: "
                          f"expected one weak {name}, found {count}"
                      )
              path.write_text("".join(lines), encoding="utf-8")

          # Re-read every target line and verify the exact binding is present.
          for filename, entries in fixes.items():
              lines = Path(filename).read_text(encoding="utf-8").splitlines()
              for line_number, name in entries.items():
                  expected = f"weak {name} = {name}"
                  if lines[line_number - 1].count(expected) != 1:
                      raise SystemExit(f"Verification failed: {filename}:{line_number}")

          print(f"Verified {sum(map(len, fixes.values()))} targeted weak-capture bindings; changed {total}.")
          PY
          git diff --check

