      - name: Build Telegram for iOS Simulator
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          # Simulator-only builds must not resolve Apple provisioning profiles or app extensions.
          # Restore the baseline .bazelrc automatically after the build, including on failure.
          bazelrc_backup="$(mktemp)"
          cp .bazelrc "$bazelrc_backup"
          restore_bazelrc() {
            cp "$bazelrc_backup" .bazelrc
            rm -f "$bazelrc_backup"
          }
          trap restore_bazelrc EXIT
          cat >> .bazelrc <<'BAZELRC'
          build --//Telegram:disableProvisioningProfiles
          build --//Telegram:disableExtensions
          # Xcode 27 libc++ reports legacy deployment-target support through
          # Clang's -W#warnings diagnostic. Keep that warning visible but prevent
          # the target's general -Werror from promoting this one diagnostic.
          # Keep Swift diagnostics visible without promoting legacy warnings to build errors,
          # matching the repository's separately passing compatibility workflow.
          build --features=-treat_warnings_as_errors
          build --cxxopt='-Wno-error=#warnings'
          BAZELRC
          printf 'build --repository_cache=%s/telegram-bazel-cache/repository\\n' "$HOME" >> .bazelrc

          # Retry transient GitHub release/proxy failures and read timeouts.
          # Real compiler or source errors still fail immediately.
          attempt=1
          while true; do
            set +e
            USE_BAZEL_VERSION=8.4.2 python3 build-system/Make/Make.py \
              --bazel="$(command -v bazelisk)" \
              --cacheDir="$HOME/telegram-bazel-cache" \
              build \
              --configurationPath=build-system/ayugram-ci-configuration.json \
              --xcodeManagedCodesigning \
              --buildNumber=200084 \
              --configuration=debug_sim_arm64 2>&1 | tee "$RUNNER_TEMP/simulator-bazel-build.log"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge 8 ] || ! grep -Eqi "504 Gateway Time-out|502 Bad Gateway|GET returned 502|Read timed out|Connection reset|timed out" "$RUNNER_TEMP/simulator-bazel-build.log"; then
              exit "$build_status"
            fi
            next_attempt=$((attempt + 1))
            delay=$((attempt * 20))
            if [ "$delay" -gt 120 ]; then delay=120; fi
            echo "::warning::Transient Bazel dependency network failure; retrying (attempt $next_attempt/8) after ${delay}s."
            attempt=$next_attempt
            sleep "$delay"
          done

