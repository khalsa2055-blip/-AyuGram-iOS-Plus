name: AyuGram iOS Plus — Four Feature Simulator Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-feature-integration
    paths:
      - '.github/workflows/four-feature-simulator.yml'
      - '.github/history-menu-smoke.py'
      - 'patches/**'
      - 'AyuGram/**'
      - 'submodules/**'
      - 'Scripts/**'

# Maximum allowed GitHub Actions job duration: 360 minutes.
# History hardening v2
# Force CI on source-level hardening fixes

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    # Full simulator/device packaging is manual-only; source checks must never start IPA packaging on push.
    # Telegram-iOS baseline builds sim_arm64; use Apple Silicon runner so Simulator can install it directly.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v5

      - name: Restore Bazel build cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: ${{ runner.os }}-telegram-bazel-eb5ae67a32c6-xcode27-${{ hashFiles('patches/**') }}
          restore-keys: |
            ${{ runner.os }}-telegram-bazel-eb5ae67a32c6-

      - name: Select Xcode 27 and verify iOS 27 runtime
        run: |
          xcodebuild -version
          xcode-select -p
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK version: $SDK_VERSION"
          case "$SDK_VERSION" in
            27.*) ;;
            *) echo "Expected an iOS 27 SDK, got $SDK_VERSION" >&2; exit 1 ;;
          esac
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/simulator-runtimes.txt"
          grep -q "iOS 27" "$RUNNER_TEMP/simulator-runtimes.txt" || {
            echo "An iOS 27 Simulator runtime is required for the launch regression test." >&2
            exit 1
          }
          if ! xcrun --find metal >/dev/null 2>&1; then
            echo "Metal toolchain missing; downloading it..."
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal

      - name: Install Bazelisk
        run: |
          brew list bazelisk >/dev/null 2>&1 || brew install bazelisk
          command -v bazelisk
          USE_BAZEL_VERSION=8.4.2 bazelisk --version

      - name: Validate required Telegram API secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing repository secret TELEGRAM_API_ID"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing repository secret TELEGRAM_API_HASH"; exit 1; }
          case "$TELEGRAM_API_ID" in
            *[!0-9]*) echo "TELEGRAM_API_ID must be numeric"; exit 1 ;;
          esac
          echo "Telegram API credentials are present."

      - name: Clone Telegram-iOS baseline
        run: |
          # Clone the baseline first, then initialize submodules individually.
          # The pinned Telegram-iOS tree references an rlottie commit that is no
          # longer fetchable from TelegramMessenger/rlottie (upload-pack: not our ref).
          git clone https://github.com/Swiftgram/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout --detach eb5ae67a32c6e8b936ca0e875f19f99251112f17
          git submodule sync --recursive

          while IFS= read -r module_entry; do
            module_path="${module_entry#* }"
            if [ "$module_path" = "submodules/rlottie/rlottie" ]; then
              echo "Skipping unavailable pinned rlottie gitlink: $module_path"
              continue
            fi
            echo "Initializing submodule: $module_path"
            initialized=0
            for attempt in 1 2 3; do
              if git submodule update --init --recursive --jobs 4 -- "$module_path"; then
                initialized=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Submodule fetch failed for $module_path (attempt $attempt/3); retrying in 5 seconds..."
                sleep 5
              fi
            done
            if [ "$initialized" -ne 1 ]; then
              echo "::error::Unable to initialize submodule $module_path after 3 attempts"
              exit 1
            fi
          done < <(git config -f .gitmodules --get-regexp path)

          # Use the latest commit that is actually present in the official rlottie
          # repository, rather than the unreachable gitlink above.
          rm -rf submodules/rlottie/rlottie
          git clone https://github.com/TelegramMessenger/rlottie.git submodules/rlottie/rlottie
          git -C submodules/rlottie/rlottie checkout --detach 67f103bc8b625f2a4a9e94f1d8c7bd84c5a08d1d
          echo "rlottie revision: $(git -C submodules/rlottie/rlottie rev-parse HEAD)"

      - name: Check Telegram baseline and align temporary Xcode metadata
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("versions.json")
          v = json.loads(path.read_text(encoding="utf-8"))
          assert v["app"] == "12.9.2", v
          xcode_output = subprocess.check_output(["xcodebuild", "-version"], text=True)
          xcode_line = next((line for line in xcode_output.splitlines() if line.startswith("Xcode ")), None)
          if not xcode_line:
              raise SystemExit("Could not read the active Xcode version: " + xcode_output)
          active_xcode = xcode_line.split()[1]
          if int(active_xcode.split(".")[0]) < 27:
              raise SystemExit("The iOS 27 scene regression requires Xcode 27 or later, got " + active_xcode)
          original_xcode = v["xcode"]
          v["xcode"] = active_xcode
          path.write_text(json.dumps(v, indent=2), encoding="utf-8")
          print("Pinned Telegram baseline:", v["app"], "original Xcode metadata:", original_xcode, "runner Xcode:", active_xcode)
          PY

      - name: Validate and apply AyuGram patch
        run: |
          cp patches/ayugram-1.3.0.patch telegram-ios/ayugram-1.3.0.patch
          cd telegram-ios
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("ayugram-1.3.0.patch").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^diff --git ", patch)
          applied = []

          for raw in sections[1:]:
              lines = raw.splitlines()
              header = lines[0]
              m = re.match(r"a/(.+?) b/(.+)$", header)
              if not m:
                  raise SystemExit(f"Bad diff header: {header!r}")
              target = Path(m.group(2))
              meta = lines[1:8]
              is_new = any(x.startswith("new file mode ") for x in meta)
              is_deleted = any(x.startswith("deleted file mode ") for x in meta)

              hunks = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("@@ "):
                      hm = re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", lines[i])
                      if not hm:
                          raise SystemExit(f"Bad hunk header in {target}: {lines[i]!r}")
                      old_start = int(hm.group(1))
                      body = []
                      i += 1
                      while i < len(lines) and not lines[i].startswith("@@ ") and not lines[i].startswith("diff --git "):
                          if not lines[i].startswith("\\ No newline at end of file"):
                              body.append(lines[i])
                          i += 1
                      hunks.append((old_start, body))
                  else:
                      i += 1

              if is_deleted:
                  if target.exists():
                      target.unlink()
                  applied.append(str(target))
                  continue

              if is_new:
                  new_lines = []
                  for line in hunks[0][1] if hunks else []:
                      if line.startswith("+") or line.startswith(" "):
                          new_lines.append(line[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("\n".join(new_lines) + ("\n" if new_lines else ""), encoding="utf-8")
                  applied.append(str(target))
                  continue

              if not target.exists():
                  raise SystemExit(f"Target file missing: {target}")
              current = target.read_text(encoding="utf-8").splitlines()
              cursor = 0

              for old_line, body in hunks:
                  old_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("-")]
                  new_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("+")]

                  if old_lines:
                      hint = max(0, old_line - 1)
                      positions = [hint] + list(range(cursor, max(cursor, len(current) - len(old_lines) + 1)))
                      seen = set()
                      found = None
                      for pos in positions:
                          if pos in seen:
                              continue
                          seen.add(pos)
                          if pos + len(old_lines) <= len(current) and current[pos:pos + len(old_lines)] == old_lines:
                              found = pos
                              break
                      if found is None:
                          raise SystemExit(f"Context mismatch applying {target} near old line {old_line}")
                      current[found:found + len(old_lines)] = new_lines
                      cursor = found + len(new_lines)
                  else:
                      insert_at = max(0, min(len(current), old_line - 1))
                      current[insert_at:insert_at] = new_lines
                      cursor = insert_at + len(new_lines)

              target.write_text("\n".join(current) + ("\n" if current else ""), encoding="utf-8")
              applied.append(str(target))

          print("Applied", len(applied), "diff sections")
          for path in applied:
              print("  ", path)
          PY

          # Comprehensive AyuGram runtime smoke-test hook (UI + feature verification).
          python3 ../Scripts/inject_ayugram_history_test.py
          python3 "$GITHUB_WORKSPACE/.github/history-menu-smoke.py"

          git diff --check

      - name: Prepare portable entitlements for iLoader signing
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path("Telegram/BUILD")
          source = build.read_text(encoding="utf-8")
          pattern = r'(?m)^\s*<key>application-identifier</key>\n\s*<string>\{telegram_team_id\}\.\{telegram_bundle_id\}</string>\n'
          source, count = re.subn(pattern, "", source, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one generated placeholder application-identifier entitlement; found {count}")
          build.write_text(source, encoding="utf-8")
          assert "<key>application-identifier</key>" not in source
          assert "<string>group.{telegram_bundle_id}</string>" in source
          print("Removed placeholder Team ID application-identifier; kept the AyuGram app-group entitlement.")
          print("The signing tool must supply application-identifier from its real provisioning profile.")
          PY

      - name: Verify AyuGram feature integrations
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch_files = list(Path("submodules").rglob("*.swift"))
          text = "\\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in patch_files)

          required = {
              "Ghost Mode packet gate": "AyuGramGhostGate.shouldSend",
              "Deleted-message capture": "AyuGramCaptureService.captureDeleted",
              "Edit-history capture": "AyuGramCaptureService.captureEdited",
              "Regex filter gate": "AyuGramRuntime.shouldFilterMessage",
              "Media archive": "AyuGramMediaArchive.archive",
              "Postbox history": "AyuGramPostboxHistoryStore",
              "Message Shot renderer": "AyuMessageShotRenderer.render",
              "Zalgo/bidi sanitizer": "AyuTextSanitizer.filterZalgo",
              "Translation service": "class AyuGramTranslationService",
              "AyuGram Settings core": "struct AyuSettings",
              "History screen": "ayuGramHistoryScreen(context: context, dialogID:",
              "Manual AyuGram Save": "AyuGramCaptureService.saveNow(",
              "Automatic History Postbox persistence": "AyuGramPostboxHistoryStore.appendDeleted",
          }

          missing = [name for name, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit("Missing AyuGram integrations: " + ", ".join(missing))

          print("Verified AyuGram integrations:", len(required))
          PY

      - name: Fix binary-output decoding in Telegram build helper
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-system/Make/BuildEnvironment.py")
          s = p.read_text(encoding="utf-8")
          old = "    output_string = output_data.decode('utf-8')"
          new = "    output_string = output_data.decode('utf-8', errors='replace')"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
          elif new not in s:
              raise SystemExit("Expected BuildEnvironment.py decode line was not found")
          PY

      - name: Harden AyuGram History persistence
        working-directory: telegram-ios
        run: python3 "$GITHUB_WORKSPACE/Scripts/harden_ayugram_history.py"
      - name: Harden saved filenames against dialog collisions
        run: python3 "$GITHUB_WORKSPACE/Scripts/harden_four_feature_storage.py"

      - name: Apply private preview and Before UI
        run: python3 "$GITHUB_WORKSPACE/Scripts/apply_four_feature_ui.py"

      - name: Test read-only invite policy and Telegram native peek route
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          swift test --package-path "$GITHUB_WORKSPACE/Experiments/PrivateInviteLinkInspector"
          python3 - <<'PY'
          from pathlib import Path

          join_link = Path("submodules/TelegramCore/Sources/TelegramEngine/Peers/JoinLink.swift").read_text(encoding="utf-8")
          preview_ui = Path("submodules/JoinLinkPreviewUI/Sources/JoinLinkPreviewController.swift").read_text(encoding="utf-8")
          settings = Path("submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift").read_text(encoding="utf-8")

          required = {
              "Telegram checkChatInvite request": "messages.checkChatInvite(hash: hash)",
              "Telegram server peek constructor": "case let .chatInvitePeek(",
              "server-granted peek result": "return .peek(EnginePeer(peer), expires)",
              "native invite resolver": "context.engine.peers.joinLinkInformation(self.link)",
              "peek deadline forwarded to chat": "ChatPeekTimeout(deadline: deadline, linkData:",
              "custom preview entry": "Preview Private Group",
              "native MTProto invite check": "joinLinkInformation(hash)",
              "peek-only navigation": "case let .peek(peer, deadline):",
              "native chat navigation": "navigateToChatController(",
              "deadline forwarded to read-only chat": "ChatPeekTimeout(deadline: deadline, linkData: hash)",
              "non-peek result rejected": "case .invite:",
          }
          sources = {
              "Telegram checkChatInvite request": join_link,
              "Telegram server peek constructor": join_link,
              "server-granted peek result": join_link,
              "native invite resolver": preview_ui,
              "peek deadline forwarded to chat": preview_ui,
              "custom preview entry": settings,
              "native MTProto invite check": settings,
              "peek-only navigation": settings,
              "native chat navigation": settings,
              "deadline forwarded to read-only chat": settings,
              "non-peek result rejected": settings,
          }
          missing = [name for name, marker in required.items() if marker not in sources[name]]
          if missing:
              raise SystemExit("Private preview native-path audit failed: " + ", ".join(missing))

          start = settings.find("private final class AyuGramPrivateInviteEntryView")
          end = settings.find("private func ayuSettingsEntries", start)
          if start < 0 or end < 0:
              raise SystemExit("Private invite entry controller could not be isolated for the no-join audit")
          controller = settings[start:end]
          forbidden = ("importChatInvite(", "joinChatInteractively(", "channels.joinChannel(", "messages.sendMessage(")
          found = [marker for marker in forbidden if marker in controller]
          if found:
              raise SystemExit("Private preview UI contains a join/send call: " + ", ".join(found))

          print("PASS: parser/access-policy unit tests passed.")
          print("PASS: preview opens Telegram's native invite resolver and forwards its server peek deadline.")
          print("PASS: custom preview controller contains no join, import-invite, or send-message call.")
          chat_controller = Path("submodules/TelegramUI/Sources/ChatController.swift").read_text(encoding="utf-8")
          peek_start = chat_controller.index("if let peekData = self.peekData")
          peek_end = chat_controller.index("self.checksTooltipDisposable", peek_start)
          peek_timeout = chat_controller[peek_start:peek_end]
          assert "AyuGram read-only peek: suppress Join action" in peek_timeout
          assert "Conversation_PrivateChannelTimeLimitedAlertJoin" not in peek_timeout
          assert "joinChatInteractively" not in peek_timeout
          print("PASS: Telegram native peek timeout cannot join after expiry.")
          chat_controller = Path("submodules/TelegramUI/Sources/ChatController.swift").read_text(encoding="utf-8")
          assert "ayuGramCanSendMessagesInCurrentChat" in chat_controller, "Scoped preview message gate is missing"
          assert "ayuGramCanSendReactionsInCurrentChat" in chat_controller, "Scoped preview reaction gate is missing"
          assert chat_controller.count("ayuGramCanSendMessagesInCurrentChat()") >= 15, "Composer/sticker/file-send paths are not all gated"
          assert chat_controller.count("ayuGramCanSendReactionsInCurrentChat()") >= 3, "Reaction entry points are not all gated"
          assert chat_controller.count("canSendMessagesToChat(self.presentationInterfaceState)") == 1, "Native message permission must remain inside the scoped wrapper"
          assert chat_controller.count("canSendReactionsToChat(self.presentationInterfaceState)") == 1, "Native reaction permission must remain inside the scoped wrapper"
          assert "canSendMessagesToChat(strongSelf.presentationInterfaceState)" not in chat_controller, "An unscoped message gate remains"
          assert "canSendReactionsToChat(strongSelf.presentationInterfaceState)" not in chat_controller, "An unscoped reaction gate remains"
          send_start = chat_controller.index("private func ayuGramCanSendMessagesInCurrentChat()")
          send_end = chat_controller.index("private func ayuGramCanSendReactionsInCurrentChat()", send_start)
          send_wrapper = chat_controller[send_start:send_end]
          assert "guard case nil = self.peekData" in send_wrapper and "return false" in send_wrapper, "Message wrapper does not deny peek mode"
          assert "return canSendMessagesToChat(self.presentationInterfaceState)" in send_wrapper, "Native message permission is not preserved"
          react_start = chat_controller.index("private func ayuGramCanSendReactionsInCurrentChat()")
          react_end = chat_controller.index("func sendMessages(", react_start)
          reaction_wrapper = chat_controller[react_start:react_end]
          assert "guard case nil = self.peekData" in reaction_wrapper and "return false" in reaction_wrapper, "Reaction wrapper does not deny peek mode"
          assert "return canSendReactionsToChat(self.presentationInterfaceState)" in reaction_wrapper, "Native reaction permission is not preserved"
          chat_state = Path("submodules/ChatPresentationInterfaceState/Sources/ChatPresentationInterfaceState.swift").read_text(encoding="utf-8")
          send_start = chat_state.index("public func canSendMessagesToChat")
          send_end = chat_state.index("public func canSendReactionsToChat", send_start)
          send_gate = chat_state[send_start:send_end]
          assert "canSendMessagesToPeer(EnginePeer(peer), ignoreDefault: canBypassRestrictions)" in send_gate, "Telegram native message permission was changed"
          react_start = chat_state.index("public func canSendReactionsToChat")
          react_end = chat_state.index("public func canJoinInaccessibleCommunityChat", react_start)
          reaction_gate = chat_state[react_start:react_end]
          assert "canSendReactionsToPeer(EnginePeer(peer), ignoreDefault: canBypassRestrictions)" in reaction_gate, "Telegram native reaction permission was changed"
          assert "AyuGram read-only peek send gate" not in send_gate, "Do not add a global membership override"
          assert "AyuGram read-only peek reactions gate" not in reaction_gate, "Do not add a global membership override"
          print("PASS: peek mode is blocked by ChatController-scoped wrappers; Telegram native permissions remain unchanged.")
          print("NOTE: actual message visibility remains conditional on Telegram returning chatInvitePeek.")
          PY

      - name: Verify four feature integrations
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          grep -q 'text: "AyuGram Save"' submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
          grep -q 'AyuGramCaptureService.captureDeleted' submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessages.swift
          grep -q 'savedStem = "account-' submodules/AyuGramIOS/Sources/AyuGramMediaArchive.swift
          grep -q 'AyuGramOriginalMediaPreviewController' submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
          grep -q 'Preview Private Group' submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'joinLinkInformation(hash)' submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'case let .peek(peer, deadline):' submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'ChatPeekTimeout(deadline: deadline, linkData: hash)' submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'navigateToChatController(' submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          ! grep -q 'applicationBindings.openUrl(raw)' submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          echo "All four feature integrations are present."

      - name: Verify group More menu History route
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreenPerformButtonAction.swift").read_text(encoding="utf-8")
          required = [
              'text: "AyuGram History"',
              "ayuGramHistoryScreen(",
              "dialogID: self.peerId.toInt64()"
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit("Group More menu History route is missing: " + ", ".join(missing))
          if source.count('text: "AyuGram History"') != 1:
              raise SystemExit("Expected exactly one AyuGram History entry in group More menu")
          print("Verified production group More menu History entry and per-group routing.")
          PY


      - name: Backport iOS 27 scene lifecycle and Xcode 27 Swift capture fix
        working-directory: telegram-ios
        run: |
          python3 "$GITHUB_WORKSPACE/Scripts/apply_ios27_scene_lifecycle.py"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramUI/Components/SubcodecAnimationCacheImpl/Sources/SubcodecAnimationCacheImpl.swift")
          source = path.read_text(encoding="utf-8")
          old = """        let disposable = MetaDisposable()
          self.impl.with { impl in
              disposable.set(impl.get(sourceId: sourceId, size: size, fetch: fetch, updateResult: { [weak self] result in"""
          new = """        let disposable = MetaDisposable()
          let implementation = self.impl
          implementation.with { impl in
              disposable.set(impl.get(sourceId: sourceId, size: size, fetch: fetch, updateResult: { [weak self] result in"""
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one SubcodecAnimationCacheImpl capture site; source changed, refusing unsafe patch")
          source = source.replace(old, new, 1)
          if "let implementation = self.impl" not in source:
              raise SystemExit("Xcode 27 Swift capture fix did not apply")
          path.write_text(source, encoding="utf-8")
          print("Applied guarded Xcode 27 weak-capture compatibility fix.")
          PY
          git diff --check

      - name: Create simulator build configuration
        working-directory: telegram-ios
        env:
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          src = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          src["bundle_id"] = "org.ayugram.iosplus"
          src["api_id"] = os.environ["TELEGRAM_API_ID"]
          src["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          src["team_id"] = "0000000000"
          src["is_internal_build"] = "true"
          src["is_appstore_build"] = "false"
          Path("build-system/ayugram-ci-configuration.json").write_text(
              json.dumps(src, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build Telegram for iOS Simulator
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          # Simulator-only builds must not resolve Apple provisioning profiles or app extensions.
          # Restore the baseline .bazelrc automatically after the build, including on failure.
          bazelrc_backup="$(mktemp)"
          cp .bazelrc "$bazelrc_backup"
          restore_bazelrc() {
            cp "$bazelrc_backup" .bazelrc
            rm -f "$bazelrc_backup"
          }
          trap restore_bazelrc EXIT
          cat >> .bazelrc <<'BAZELRC'
          build --//Telegram:disableProvisioningProfiles
          build --//Telegram:disableExtensions
          BAZELRC

          echo "Simulator build (single cached attempt)"
          USE_BAZEL_VERSION=8.4.2 python3 build-system/Make/Make.py \
            --bazel="$(command -v bazelisk)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --xcodeManagedCodesigning \
            --buildNumber=200084 \
            --configuration=debug_sim_arm64

      - name: Smoke-test app in iPhone Simulator
        working-directory: telegram-ios
        run: |
          set -euo pipefail

          # Always exercise the app on an iOS 27 iPhone Simulator. A previously booted
          # iOS 26 simulator must not silently turn this into an older lifecycle test.
          DEVICE_UDID="$(python3 - <<'PY'
          import json
          import subprocess
          import sys

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True
          ))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS-27" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, device.get("name", ""), device["udid"]))
          if not candidates:
              sys.exit("No available iOS 27 iPhone Simulator was found.")
          candidates.sort()
          print(candidates[-1][2])
          PY
          )"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl list devices | grep "$DEVICE_UDID"

          ipa="bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$ipa" ]; then
            # bazel-bin is a symlink; find must follow it on macOS runners.
            ipa=$(find -L bazel-bin -type f -name "*.ipa" -print -quit || true)
          fi
          test -n "$ipa" && test -f "$ipa"

          rm -rf ci-artifacts/smoke
          mkdir -p ci-artifacts/smoke
          unzip -q -o "$ipa" -d ci-artifacts/smoke
          app=$(find ci-artifacts/smoke/Payload -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$app" && test -d "$app"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test "$bundle_id" = "org.ayugram.iosplus"
          export APP_PATH="$app"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = plistlib.loads((Path(__import__("os").environ["APP_PATH"]) / "Info.plist").read_bytes())
          assert info.get("UIFileSharingEnabled") is True, info.get("UIFileSharingEnabled")
          assert info.get("LSSupportsOpeningDocumentsInPlace") is True, info.get("LSSupportsOpeningDocumentsInPlace")
          print("Final app Documents/Files flags: enabled")
          manifest = info.get("UIApplicationSceneManifest")
          assert isinstance(manifest, dict), "Missing UIApplicationSceneManifest"
          assert manifest.get("UIApplicationSupportsMultipleScenes") is False
          role = manifest.get("UISceneConfigurations", {}).get("UIWindowSceneSessionRoleApplication", [])
          assert any(item.get("UISceneDelegateClassName") == "SceneDelegate" for item in role), role
          print("iOS 27 scene manifest points to SceneDelegate.")
          PY


          main_binary="$app/$executable"
          lipo "$main_binary" -verify_arch arm64
          if lipo "$main_binary" -verify_arch x86_64 >/dev/null 2>&1; then
            echo "Unexpected x86_64 simulator slice detected."
            exit 1
          fi

          # Remove the app first so an old Documents container cannot make a stale
          # marker/report look like a successful test on a new launch.
          xcrun simctl uninstall "$DEVICE_UDID" "$bundle_id" >/dev/null 2>&1 || true
          xcrun simctl install "$DEVICE_UDID" "$app"

          # Capture a clean, ordinary launch before any AyuGram test arguments.
          # This distinguishes a real app-startup/UI failure from the feature harness.
          mkdir -p ci-artifacts/smoke
          set +e
          normal_launch=$(xcrun simctl launch --terminate-running-process "$DEVICE_UDID" "$bundle_id" 2>&1)
          normal_launch_rc=$?
          set -e
          echo "Ordinary launch result: $normal_launch"
          echo "Capturing startup diagnostics for executable: $executable"
          if [ "$normal_launch_rc" -ne 0 ]; then
            xcrun simctl spawn "$DEVICE_UDID" log show --last 2m --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tail -300 || true
            exit "$normal_launch_rc"
          fi
          sleep 15
          xcrun simctl io "$DEVICE_UDID" screenshot ci-artifacts/smoke/AyuGram-Normal-Launch.png
          test -s ci-artifacts/smoke/AyuGram-Normal-Launch.png
          xcrun simctl spawn "$DEVICE_UDID" log show --last 30s --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tee ci-artifacts/smoke/AyuGram-Normal-Launch.log | tail -180
          xcrun simctl terminate "$DEVICE_UDID" "$bundle_id" >/dev/null 2>&1 || true
          APP_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_UDID" "$bundle_id" data)
          DOCUMENTS="$APP_CONTAINER/Documents"
          mkdir -p "$DOCUMENTS"
          rm -f "$DOCUMENTS/AyuGramHistoryMenuHarnessReady.txt" \
                "$DOCUMENTS/AyuGramHistoryListHarnessReady.txt" \
                "$DOCUMENTS/AyuGramHistoryListSmokeReport.json"
          
          # Run the actual in-app save implementation against a two-file album and
          # a text-only message before the separate unauthenticated History UI fixture.
          # This catches regressions in the multi-media path without using a fake UI.
          rm -rf "$DOCUMENTS/AyuGram" "$DOCUMENTS/Telegram/AyuGram"
          set +e
          feature_smoke_launch=$(xcrun simctl launch --terminate-running-process "$DEVICE_UDID" "$bundle_id" -AyuGramFullSmokeTest 2>&1)
          feature_smoke_rc=$?
          set -e
          echo "$feature_smoke_launch"
          test "$feature_smoke_rc" -eq 0 || {
            echo "AyuGram save regression-test launch failed." >&2
            exit "$feature_smoke_rc"
          }
          feature_report="$DOCUMENTS/AyuGram/AyuGramSmokeReport.json"
          for attempt in $(seq 1 45); do
            if [ -s "$feature_report" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -s "$feature_report" ]; then
            echo "AyuGram save regression report was not created." >&2
            xcrun simctl spawn "$DEVICE_UDID" log show --last 2m --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tail -250 || true
            exit 1
          fi
          python3 - "$feature_report" <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("AyuGram save regression report:")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          items = {item.get("name"): item for item in report.get("items", [])}
          required = ("History → Saved media copy", "History → Saved text copy", "Saved media isolation by dialog")
          for name in required:
              assert name in items, f"Missing runtime check: {name}"
              assert items[name].get("passed") is True, items[name]
          print("Multi-media Save, text-only Save, and cross-dialog isolation runtime checks passed.")
          PY
          xcrun simctl terminate "$DEVICE_UDID" "$bundle_id" >/dev/null 2>&1 || true

          set +e
          launch_output=$(xcrun simctl launch "$DEVICE_UDID" "$bundle_id" -AyuGramHistoryListSmokeTest -AyuGramHistoryListOnlySmokeTest 2>&1)
          launch_rc=$?
          set -e
          echo "$launch_output"
          test "$launch_rc" -eq 0 || {
            echo "simctl launch failed with exit code $launch_rc" >&2
            xcrun simctl spawn "$DEVICE_UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "Telegram" OR eventMessage CONTAINS[c] "ayugram" OR process == "SpringBoard"' | tail -300 || true
            exit "$launch_rc"
          }

          # simctl launch returning a PID is the reliable launch contract here.
          # ps inside the simulator does not consistently expose third-party process names.
          echo "Simulator launch succeeded: $launch_output"

          # The Simulator has no authenticated Telegram session, so this
          # launch-only harness renders the group More menu and a synthetic deleted
          # History row. The production menu action is separately verified above.
          echo "Simulator app data container: $APP_CONTAINER"
          echo "Cleared stale History smoke markers before launch."
          mkdir -p ci-artifacts/smoke
          history_marker=""
          report=""
          for attempt in $(seq 1 75); do
            history_marker=$(find "$DOCUMENTS" -type f -name "AyuGramHistoryListHarnessReady.txt" -print -quit 2>/dev/null || true)
            report=$(find "$DOCUMENTS" -type f -name "AyuGramHistoryListSmokeReport.json" -print -quit 2>/dev/null || true)
            if [ -n "$history_marker" ] && [ -f "$history_marker" ] && [ -n "$report" ] && [ -f "$report" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$history_marker" ] || [ ! -f "$history_marker" ] || [ -z "$report" ] || [ ! -f "$report" ]; then
            xcrun simctl io "$DEVICE_UDID" screenshot ci-artifacts/smoke/AyuGram-History-Test-Failed.png
            echo "History-only harness did not render its message-bubble list." >&2
            xcrun simctl spawn "$DEVICE_UDID" log show --last 2m --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tail -200 || true
            exit 1
          fi

          xcrun simctl io "$DEVICE_UDID" screenshot ci-artifacts/smoke/AyuGram-History-List.png
          test -s ci-artifacts/smoke/AyuGram-History-List.png
          cat > ci-artifacts/smoke/verify-history-screenshots.swift <<'SWIFT'
          import Foundation
          import Vision
          import ImageIO
          import Darwin

          func recognizedText(_ path: String) throws -> String {
              let url = URL(fileURLWithPath: path)
              let request = VNRecognizeTextRequest()
              request.recognitionLevel = .accurate
              request.usesLanguageCorrection = false
              let handler = VNImageRequestHandler(url: url)
              try handler.perform([request])
              return (request.results ?? []).compactMap { $0.topCandidates(1).first?.string }.joined(separator: "\n")
          }

          let historyText = try recognizedText("ci-artifacts/smoke/AyuGram-History-List.png")
          print("History screenshot OCR:\n\\(historyText)")
          let actualHistoryScreen = historyText.localizedCaseInsensitiveContains("Deleted message")
              && historyText.localizedCaseInsensitiveContains("Synthetic deleted message")
          let visualFallbackFixture = historyText.localizedCaseInsensitiveContains("AyuGram deleted-history smoke test")
              && historyText.localizedCaseInsensitiveContains("Deleted: just now")
          guard historyText.localizedCaseInsensitiveContains("Smoke Test Sender"),
                (actualHistoryScreen || visualFallbackFixture),
                !historyText.localizedCaseInsensitiveContains("Start Messaging") else {
              fputs("History screenshot is neither the actual deleted-message list nor the intended fallback fixture.\n", stderr)
              exit(1)
          }
          if actualHistoryScreen {
              print("Production AyuGram History screen text detected.")
          } else {
              print("WARNING: This screenshot is the explicitly labeled unauthenticated visual fixture, not the production History screen.")
          }
          SWIFT
          swift ci-artifacts/smoke/verify-history-screenshots.swift
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "History harness report was not created." >&2
            exit 1
          fi
          cp "$report" ci-artifacts/smoke/AyuGramHistoryListSmokeReport.json
          python3 - "$report" <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert report.get("passed") is True, report
          mode = str(report.get("mode", ""))
          if "visual fixture" in mode.lower():
              assert report.get("visual_fixture_rendered") is True, report
              assert report.get("production_history_screen_tested") is False, report
              print("Unauthenticated History layout fixture passed. Production History runtime behavior was NOT tested in this Simulator run.")
          else:
              assert report.get("senderName") == "Smoke Test Sender", report
              assert report.get("dialogID") is not None, report
              print("Production History hook reported a rendered per-dialog entry.")
          PY

          # Check only for recent Telegram-process crash/fatal messages; do not treat
          # unrelated SpringBoard system messages as an app failure.
          if xcrun simctl spawn "$DEVICE_UDID" log show --last 20s --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | grep -Ei 'crash|fatal|abort|jetsam' >/dev/null 2>&1; then
            echo "Potential Telegram process crash/fatal event detected." >&2
            xcrun simctl spawn "$DEVICE_UDID" log show --last 1m --style compact --predicate '(process == "Swiftgram" OR process == "Telegram")' | tail -300 || true
            exit 1
          fi

          echo "Simulator build and runtime save smoke checks passed for $bundle_id. See the History report above to distinguish the visual fixture from a production-screen test."
          xcrun simctl terminate "$DEVICE_UDID" "$bundle_id" || true

      - name: Collect simulator artifacts
        working-directory: telegram-ios
        run: |
          set -e
          mkdir -p ci-artifacts/extracted
          
          # Telegram's simulator target is emitted as an IPA by this Make.py path.
          # Extract the .app from the IPA for direct simulator use.
          ipa="bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$ipa" ]; then
            # bazel-bin is a symlink; find must follow it on macOS runners.
            ipa=$(find -L bazel-bin -type f -name "*.ipa" -print -quit || true)
          fi
          if [ -z "$ipa" ] || [ ! -f "$ipa" ]; then
            echo "No simulator IPA artifact was produced." >&2
            find bazel-bin -maxdepth 5 -type f | head -200 || true
            exit 1
          fi

          echo "Using IPA: $ipa"
          unzip -q -o "$ipa" -d ci-artifacts/extracted
          app=$(find ci-artifacts/extracted/Payload -type d -name "*.app" -print -quit)
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "No .app bundle found inside simulator IPA." >&2
            find ci-artifacts/extracted -maxdepth 4 -print | head -200 || true
            exit 1
          fi

          name=$(basename "$app")
          ditto "$app" "ci-artifacts/$name"
          tar -czf ci-artifacts/AyuGram-iOS-Plus-four-feature-simulator-apps.tar.gz -C ci-artifacts "$name"
          cp "$ipa" "ci-artifacts/AyuGram-iOS-simulator.ipa"
          rm -rf ci-artifacts/extracted

          ls -lh ci-artifacts

      - name: Prepare unsigned arm64 device IPA for iLoader
        if: success() # Prepare only after every prior validation has passed.
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Device builds require rules_apple to see a profile artifact even when
          # the final IPA is intentionally unsigned for PC-side iLoader signing.
          profile_partial = Path("build-system/bazel-rules/rules_apple/apple/internal/partials/provisioning_profile.bzl")
          if not profile_partial.is_file():
              raise SystemExit(f"rules_apple provisioning partial not found: {profile_partial}")
          source = profile_partial.read_text(encoding="utf-8")
          old = '''    if not profile_artifact:
                  fail(
                      "\\n".join([
                          "ERROR: In {}:".format(str(rule_label)),
                          "Building for device, but no provisioning_profile attribute was set.",
                      ]),
                  )'''
          new = '''    if not profile_artifact:
                  # CI produces an unsigned IPA; iLoader will apply device signing.
                  return struct(bundle_files = [])'''
          if new not in source:
              if old not in source:
                  raise SystemExit("rules_apple provisioning partial changed; refusing an unsafe patch")
              source = source.replace(old, new, 1)
              profile_partial.write_text(source, encoding="utf-8")

          make = Path("build-system/Make/Make.py")
          source = make.read_text(encoding="utf-8")
          lines = source.splitlines()
          anchor = "bazel_command_line.set_custom_target(arguments.target)"
          for index, line in enumerate(lines):
              if line.strip() == anchor:
                  indent = line[:len(line) - len(line.lstrip())]
                  additions = [
                      indent + "if arguments.configuration in ('debug_sim_arm64', 'release_sim_arm64', 'debug_arm64', 'release_arm64'):",
                      indent + "    bazel_command_line.set_disable_provisioning_profiles()",
                      indent + "if arguments.configuration in ('debug_arm64', 'release_arm64'):",
                      indent + "    # Leave device code signing to iLoader on the user's PC.",
                      indent + "    bazel_command_line.common_args.append('--features=disable_legacy_signing')",
                  ]
                  if additions[0] not in lines[index + 1:index + 6]:
                      lines[index + 1:index + 1] = additions
                  break
          else:
              raise SystemExit("Make.py build hook anchor was not found")
          make.write_text(chr(10).join(lines) + chr(10), encoding="utf-8")

          patched = profile_partial.read_text(encoding="utf-8")
          assert "return struct(bundle_files = [])" in patched
          assert "disable_legacy_signing" in make.read_text(encoding="utf-8")
          print("Configured device IPA packaging without Apple signing assets; iLoader will sign it.")
          PY

      - name: Build and verify arm64 iPhone IPA
        if: success() # Build and upload only after validation and preparation succeed.
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          echo "Building the device-only arm64 target using the warmed Bazel cache."
          USE_BAZEL_VERSION=8.4.2 python3 build-system/Make/Make.py \
            --bazel="$(command -v bazelisk)" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --overrideXcodeVersion \
            --xcodeManagedCodesigning \
            --buildNumber=200084 \
            --configuration=release_arm64

          ipa="bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$ipa" ]; then
            ipa=$(find -L bazel-bin -type f -name "*.ipa" -print -quit || true)
          fi
          test -n "$ipa" && test -f "$ipa"

          rm -rf ci-artifacts/device-extracted
          mkdir -p ci-artifacts/device-extracted
          unzip -q -o "$ipa" -d ci-artifacts/device-extracted
          app=$(find ci-artifacts/device-extracted/Payload -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$app" && test -d "$app"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test "$bundle_id" = "org.ayugram.iosplus"
          main_binary="$app/$executable"
          lipo "$main_binary" -verify_arch arm64
          archs=$(lipo -archs "$main_binary")
          echo "Device binary architectures: $archs"
          vtool -show-build "$main_binary" | tee ci-artifacts/device-build-platform.txt
          grep -Eq 'platform IOS([[:space:]]|$)' ci-artifacts/device-build-platform.txt
          if grep -q 'platform IOSSIMULATOR' ci-artifacts/device-build-platform.txt; then
            echo "Simulator binary was produced instead of an iPhone device binary." >&2
            exit 1
          fi

          if [ -e "$app/embedded.mobileprovision" ]; then
            echo "Unexpected embedded provisioning profile in the device IPA." >&2
            exit 1
          fi
          if codesign -dv --verbose=4 "$app" > "$RUNNER_TEMP/ayugram-device-codesign.txt" 2>&1; then
            cp "$RUNNER_TEMP/ayugram-device-codesign.txt" ci-artifacts/device-codesign.txt
            echo "The app bundle carries a code signature; inspect device-codesign.txt."
          else
            echo "The app bundle is unsigned. It must be signed by iLoader or another signing tool before installation."
            echo "unsigned; no embedded provisioning profile" > ci-artifacts/device-codesign.txt
          fi

          cp "$ipa" ci-artifacts/AyuGram-iOS-Plus-device-arm64.ipa
          rm -rf ci-artifacts/device-extracted
          ls -lh ci-artifacts/AyuGram-iOS-Plus-device-arm64.ipa

      - name: Upload arm64 device IPA
        if: success() # Build and upload only after validation and preparation succeed.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-device-arm64-${{ github.run_number }}
          path: telegram-ios/ci-artifacts/AyuGram-iOS-Plus-device-arm64.ipa
          if-no-files-found: error

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-four-feature-screenshots-${{ github.run_number }}
          path: |
            telegram-ios/ci-artifacts/smoke/AyuGram-History-*.png
            telegram-ios/ci-artifacts/smoke/AyuGram-Normal-Launch.png
            telegram-ios/ci-artifacts/smoke/AyuGram-Normal-Launch.log
          if-no-files-found: warn

      - name: Upload simulator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-Plus-four-feature-simulator-${{ github.run_number }}
          path: telegram-ios/ci-artifacts
          if-no-files-found: error
