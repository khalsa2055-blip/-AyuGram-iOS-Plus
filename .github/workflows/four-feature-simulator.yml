          # the final IPA is intentionally unsigned for PC-side iLoader signing.
          profile_partial = Path("build-system/bazel-rules/rules_apple/apple/internal/partials/provisioning_profile.bzl")
          if not profile_partial.is_file():
              raise SystemExit(f"rules_apple provisioning partial not found: {profile_partial}")
