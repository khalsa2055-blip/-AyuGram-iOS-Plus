name: Private Group Preview — Repair Checks (No IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-feature-integration
    paths:
      - 'Experiments/PrivateInviteLinkInspector/**'
      - 'Scripts/apply_four_feature_ui.py'
      - '.github/workflows/private-preview-repair-checks.yml'

permissions:
  contents: read

concurrency:
  group: private-preview-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-repair-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Run isolated invite policy tests
        run: swift test --package-path Experiments/PrivateInviteLinkInspector

      - name: Audit integration wiring and read-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("Scripts/apply_four_feature_ui.py").read_text(encoding="utf-8")
          core = Path("Experiments/PrivateInviteLinkInspector/Sources/PrivateInviteLinkInspector")
          swift = "\\n".join(p.read_text(encoding="utf-8") for p in core.glob("*.swift"))

          required = {
              "AyuGram settings row": '".privateInvitePreview,',
              "settings navigation controller": "AyuGramPrivateInvitePreviewController(context: arguments.context)",
              "URL input accessibility id": 'privateInviteURLField',
              "server-granted peek gate": "case let .peek(chat) = result",
              "expiry guard": "guard now < chat.expiresAt",
              "bounded history request": "(1...100).contains(limit)",
          }
          combined = patch + "\\n" + swift
          missing = [name for name, marker in required.items() if marker not in combined]
          if missing:
              raise SystemExit("Missing preview safeguards: " + ", ".join(missing))

          forbidden_calls = [
              r"\\.importChatInvite\\s*\\(",
              r"\\.joinChannel\\s*\\(",
              r"\\.sendMessage\\s*\\(",
              r"\\.sendMedia\\s*\\(",
          ]
          for pattern in forbidden_calls:
              if re.search(pattern, swift):
                  raise SystemExit("Forbidden mutating Telegram call found: " + pattern)

          # Explicitly report the known integration gap instead of treating a
          # URL handoff as a functioning message/media preview.
          has_native_adapter = any(
              marker in combined for marker in (
                  "TelegramPeekMessageProvider",
                  "AyuGramTelegramPeekAdapter",
                  "joinLinkInformation(hash:"
              )
          )
          has_timeline = any(
              marker in combined for marker in (
                  "AyuGramPrivateInviteTimeline",
                  "PreviewMessageCell",
                  "PrivateInviteMessagesNode"
              )
          )
          has_media_renderer = any(
              marker in combined for marker in (
                  "AyuGramPrivateInviteMediaView",
                  "PreviewMediaRenderer"
              )
          )
          print("PASS: settings entry, server-peek gate, expiry and read-only boundaries")
          print("Native MTProto adapter:", "present" if has_native_adapter else "MISSING")
          print("Message timeline:", "present" if has_timeline else "MISSING")
          print("Media renderer:", "present" if has_media_renderer else "MISSING")
          if not (has_native_adapter and has_timeline and has_media_renderer):
              print("BLOCKED: app preview is not end-to-end integrated; no IPA/build is run by this workflow.")
          PY

      - name: Verify workflow never invokes an app build
        run: |
          ! grep -Eq 'bazel build|xcodebuild|build-simulator|ipa|\.ipa' .github/workflows/private-preview-repair-checks.yml
