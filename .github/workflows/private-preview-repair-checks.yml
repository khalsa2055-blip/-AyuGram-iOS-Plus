name: Private Group Preview — Repair Checks (No IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-feature-integration
    paths:
      - 'Experiments/PrivateInviteLinkInspector/**'
      - 'Scripts/apply_four_feature_ui.py'
      - 'Scripts/apply_private_invite_preview.py'
      - '.github/workflows/private-preview-repair-checks.yml'
      - '.github/workflows/four-feature-simulator.yml'
      - '.github/workflows/private-invite-preview-simulator.yml'

permissions:
  contents: read

concurrency:
  group: private-preview-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-repair-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Validate patch script syntax
        run: |
          python3 -m py_compile Scripts/apply_four_feature_ui.py
          python3 -m py_compile Scripts/apply_private_invite_preview.py

      - name: Parse generated production and legacy Swift preview controllers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          patch = Path("Scripts/apply_four_feature_ui.py").read_text(encoding="utf-8")
          legacy = Path("Scripts/apply_private_invite_preview.py").read_text(encoding="utf-8")
          sources = {
              "production-private-preview.swift": re.search(
                  r"r'''(private final class AyuGramPrivateInviteEntryView.*?)'''", patch, re.S
              ),
              "legacy-private-preview.swift": re.search(
                  r"ENTRY_CONTROLLER = r'''(.*?)'''", legacy, re.S
              ),
          }
          root = Path(os.environ["RUNNER_TEMP"])
          for filename, match in sources.items():
              if match is None:
                  raise SystemExit("Could not extract generated Swift source: " + filename)
              source = match.group(1)
              if filename == "production-private-preview.swift":
                  # The replacement string intentionally includes the following
                  # ayuSettingsEntries function signature; its body lives outside
                  # the generated preview controller and is not part of this parse.
                  source = source.split("private func ayuSettingsEntries", 1)[0]
              target = root / filename
              target.write_text(source, encoding="utf-8")
              print("Extracted", target)
          PY
          swiftc -frontend -parse "$RUNNER_TEMP/production-private-preview.swift"
          swiftc -frontend -parse "$RUNNER_TEMP/legacy-private-preview.swift"
          echo "PASS: generated preview controllers parse as Swift; no app or IPA build was run."

      - name: Run isolated invite policy tests
        run: swift test --package-path Experiments/PrivateInviteLinkInspector

      - name: Audit integration wiring and read-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("Scripts/apply_four_feature_ui.py").read_text(encoding="utf-8")
          legacy = Path("Scripts/apply_private_invite_preview.py").read_text(encoding="utf-8")
          core = Path("Experiments/PrivateInviteLinkInspector/Sources/PrivateInviteLinkInspector")
          simulator_workflow = Path(".github/workflows/four-feature-simulator.yml").read_text(encoding="utf-8")
          legacy_workflow = Path(".github/workflows/private-invite-preview-simulator.yml").read_text(encoding="utf-8")
          swift = "\\n".join(p.read_text(encoding="utf-8") for p in core.glob("*.swift"))

          required = {
              "Settings > My Profile row": '"Private Group Preview"',
              "Settings > My Profile action": "interaction.openSettings(.privateInvitePreview)",
              "Settings > My Profile navigation": "ayuGramPrivateInvitePreviewController(context: self.context)",
              "URL input accessibility id": 'privateInviteURLField',
              "preview Back button": "privateInvitePreviewBackButton",
              "preview Back action": "entryView.onBack",
              "server-granted peek gate": "case let .peek(chat) = result",
              "expiry guard": "guard now < chat.expiresAt",
              "bounded history request": "(1...100).contains(limit)",
          }
          native_required = {
              "Telegram MTProto invite resolver": "joinLinkInformation(hash)",
              "server-authorized peek branch": "case let .peek(peer, deadline):",
              "native read-only chat timeout": "ChatPeekTimeout(deadline: deadline, linkData: hash)",
              "native Telegram chat navigation": "navigateToChatController(",
              "metadata-only fallback branch": "case let .invite(invite):",
              "metadata-only renderer has no join action": "entryView.showInviteInfo(invite)",
              "denied preview sends no join or request": "No join or request has been sent",
              "neutral status renderer": "func showStatus(_ message: String)",
              "already-member handling": "case let .alreadyJoined(peer):",
              "already-member opens the confirmed peer without joining": "Open the existing chat normally; this is not a join action.",
              "approval-required invite metadata": "invite.flags.requestNeeded",
              "accurate supergroup label": '"Supergroup"',
              "basic-group no-peek fallback": "Telegram does not provide invite-link message previews for basic groups.",
              "connection-aware invite verification error": "or your connection may be unavailable.",
              "strict local invite parser": "ayuGramPrivateInviteHash(raw)",
              "Telegram tg:// invite parser": 'scheme == "tg"',
              "Telegram invite query validation": 'items[0].name == "invite"',
          }
          combined = patch + "\\n" + swift
          missing = [name for name, marker in required.items() if marker not in combined]
          native_missing = [name for name, marker in native_required.items() if marker not in patch]
          if missing or native_missing:
              raise SystemExit("Missing preview safeguards: " + ", ".join(missing + native_missing))

          forbidden_calls = [
              r"\.importChatInvite\s*\(",
              r"\.joinChatInteractively\s*\(",
              r"\.joinChannel\s*\(",
              r"\.sendMessage\s*\(",
              r"\.sendMedia\s*\(",
          ]
          for pattern in forbidden_calls:
              if re.search(pattern, patch + "\\n" + swift):
                  raise SystemExit("Forbidden mutating Telegram call found: " + pattern)

          if "applicationBindings.openUrl(raw)" in patch or "openExternalUrl(" in patch:
              raise SystemExit("Invite preview must not expose an external invitation/join handoff")
          if any(marker in patch for marker in ("privateInviteOpenInTelegramButton", "onOpenInvite", "importChatInvite", "joinChatInteractively", "channels.joinChannel")):
              raise SystemExit("Invite preview must never expose a join/request action")

          # Inspect the exact generated production UI, not just marker strings.
          generated = re.search(r"r'''(private final class AyuGramPrivateInviteEntryView[\s\S]*?)'''", patch)
          if not generated:
              raise SystemExit("Could not isolate the generated production invite-preview controller")
          production_ui = generated.group(1)
          peek_branch = production_ui.split("case let .peek(peer, deadline):", 1)[1].split("case let .invite(invite):", 1)[0]
          invite_branch = production_ui.split("case let .invite(invite):", 1)[1].split("case let .alreadyJoined(peer):", 1)[0]
          if "navigateToChatController(" not in peek_branch or "ChatPeekTimeout(deadline: deadline, linkData: hash)" not in peek_branch:
              raise SystemExit("Server-granted peek is not routed through Telegram's native read-only ChatPeekTimeout")
          if "entryView.showInviteInfo(invite)" not in invite_branch:
              raise SystemExit("Denied invite result is not rendered as metadata-only")
          unsafe_preview_markers = (
              "openExternalUrl(", "applicationBindings.openUrl(", "fallbackButton",
              "onOpenInvite", "privateInviteOpenInTelegramButton",
              "joinChatInteractively(", "importChatInvite(", "channels.joinChannel("
          )
          for marker in unsafe_preview_markers:
              if marker in production_ui:
                  raise SystemExit("Unsafe action found in production preview controller: " + marker)
          if 'scheme == "https"' not in production_ui or 'scheme == "https" || scheme == "http"' in production_ui:
              raise SystemExit("Production invite parser must require HTTPS for web invite URLs")

          # The old experimental installer must obey the same server-authorized peek contract.
          legacy_entry = re.search(r"ENTRY_CONTROLLER = r'''([\s\S]*?)'''", legacy)
          if not legacy_entry:
              raise SystemExit("Could not isolate the legacy experimental preview controller")
          legacy_ui = legacy_entry.group(1)
          legacy_peek = legacy_ui.split("case let .peek(peer, deadline):", 1)[1].split("case let .invite(invite):", 1)[0]
          legacy_invite = legacy_ui.split("case let .invite(invite):", 1)[1].split("case let .alreadyJoined(peer):", 1)[0]
          if "joinLinkInformation(hash)" not in legacy_ui or "ChatPeekTimeout(deadline: deadline, linkData: hash)" not in legacy_peek:
              raise SystemExit("Legacy preview installer no longer follows Telegram's authorized peek route")
          if "entryView.showInviteInfo(invite)" not in legacy_invite:
              raise SystemExit("Legacy denied-invite handling is not metadata-only")
          for marker in unsafe_preview_markers:
              if marker in legacy_ui:
                  raise SystemExit("Unsafe action found in legacy preview controller: " + marker)

          if "ref: eb5ae67a32c6e8b936ca0e875f19f99251112f17" not in legacy_workflow:
              raise SystemExit("Legacy preview simulator must use the pinned Telegram-iOS baseline")
          if "if: github.event_name == 'workflow_dispatch'" not in simulator_workflow:
              raise SystemExit("Push events must not run simulator/IPA packaging")
          # The scoped ChatController wrapper must deny a peek but delegate to
          # Telegram's original permission functions in every ordinary chat.
          scoped_permissions = (
              "private func ayuGramCanSendMessagesInCurrentChat() -> Bool",
              "private func ayuGramCanSendReactionsInCurrentChat() -> Bool",
              "guard case nil = self.peekData",
              "return canSendMessagesToChat(self.presentationInterfaceState)",
              "return canSendReactionsToChat(self.presentationInterfaceState)",
          )
          missing_scoped = [marker for marker in scoped_permissions if marker not in patch]
          if missing_scoped:
              raise SystemExit("Missing scoped read-only permission gates: " + ", ".join(missing_scoped))
          if "ChatPresentationInterfaceState.swift" in patch or "case .member = channel.participationStatus" in patch:
              raise SystemExit("Preview must not globally change Telegram permissions for ordinary chats")
          print("PASS: settings entry, HTTPS invite parsing and official tg://join invite parsing")
          print("PASS: denied-preview state is metadata-only; no join, request, or external invitation action exists")
          print("PASS: Telegram MTProto checkChatInvite path via joinLinkInformation")
          print("PASS: only server-issued .peek opens ChatController with ChatPeekTimeout")
          print("PASS: invite metadata-only fallback is displayed without participant identities; no join/send APIs")
          print("PASS: peek-only send/reaction gates delegate to native Telegram permissions otherwise")
          print("PASS: native Telegram chat timeline and media rendering are used")
          PY
