name: Private Group Preview — Repair Checks (No IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/four-feature-integration
    paths:
      - 'Experiments/PrivateInviteLinkInspector/**'
      - 'Scripts/apply_four_feature_ui.py'
      - '.github/workflows/private-preview-repair-checks.yml'

permissions:
  contents: read

concurrency:
  group: private-preview-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-repair-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Validate patch script syntax
        run: python3 -m py_compile Scripts/apply_four_feature_ui.py

      - name: Run isolated invite policy tests
        run: swift test --package-path Experiments/PrivateInviteLinkInspector

      - name: Audit integration wiring and read-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("Scripts/apply_four_feature_ui.py").read_text(encoding="utf-8")
          core = Path("Experiments/PrivateInviteLinkInspector/Sources/PrivateInviteLinkInspector")
          swift = "\\n".join(p.read_text(encoding="utf-8") for p in core.glob("*.swift"))

          required = {
              "AyuGram settings row": ".privateInvitePreview,",
              "settings navigation controller": "AyuGramPrivateInvitePreviewController(context: arguments.context)",
              "URL input accessibility id": 'privateInviteURLField',
              "preview Back button": "privateInvitePreviewBackButton",
              "preview Back action": "entryView.onBack",
              "server-granted peek gate": "case let .peek(chat) = result",
              "expiry guard": "guard now < chat.expiresAt",
              "bounded history request": "(1...100).contains(limit)",
          }
          native_required = {
              "Telegram MTProto invite resolver": "joinLinkInformation(hash)",
              "server-authorized peek branch": "case let .peek(peer, deadline):",
              "native read-only chat timeout": "ChatPeekTimeout(deadline: deadline, linkData: hash)",
              "native Telegram chat navigation": "navigateToChatController(",
              "non-peek denial branch": "case .invite:",
              "already-member handling": "case .alreadyJoined:",
              "strict local invite parser": "ayuGramPrivateInviteHash(raw)",
          }
          combined = patch + "\\n" + swift
          missing = [name for name, marker in required.items() if marker not in combined]
          native_missing = [name for name, marker in native_required.items() if marker not in patch]
          if missing or native_missing:
              raise SystemExit("Missing preview safeguards: " + ", ".join(missing + native_missing))

          forbidden_calls = [
              r"\.importChatInvite\s*\(",
              r"\.joinChatInteractively\s*\(",
              r"\.joinChannel\s*\(",
              r"\.sendMessage\s*\(",
              r"\.sendMedia\s*\(",
          ]
          for pattern in forbidden_calls:
              if re.search(pattern, patch + "\\n" + swift):
                  raise SystemExit("Forbidden mutating Telegram call found: " + pattern)

          if "applicationBindings.openUrl(raw)" in patch:
              raise SystemExit("Invite preview must not use generic/external URL handoff")
          if "importChatInvite" in patch or "joinChatInteractively" in patch:
              raise SystemExit("Invite preview must never invoke a join operation")
          # The scoped ChatController wrapper must deny a peek but delegate to
          # Telegram's original permission functions in every ordinary chat.
          scoped_permissions = (
              "private func ayuGramCanSendMessagesInCurrentChat() -> Bool",
              "private func ayuGramCanSendReactionsInCurrentChat() -> Bool",
              "guard case nil = self.peekData",
              "return canSendMessagesToChat(self.presentationInterfaceState)",
              "return canSendReactionsToChat(self.presentationInterfaceState)",
          )
          missing_scoped = [marker for marker in scoped_permissions if marker not in patch]
          if missing_scoped:
              raise SystemExit("Missing scoped read-only permission gates: " + ", ".join(missing_scoped))
          if "ChatPresentationInterfaceState.swift" in patch or "case .member = channel.participationStatus" in patch:
              raise SystemExit("Preview must not globally change Telegram permissions for ordinary chats")
          print("PASS: settings entry and safe invite parsing")
          print("PASS: Telegram MTProto checkChatInvite path via joinLinkInformation")
          print("PASS: only server-issued .peek opens ChatController with ChatPeekTimeout")
          print("PASS: invite metadata/member identities are not exposed; no join/send APIs")
          print("PASS: peek-only send/reaction gates delegate to native Telegram permissions otherwise")
          print("PASS: native Telegram chat timeline and media rendering are used")
          PY
