name: AyuGram iOS — Swiftgram Compatibility Check

on:
  workflow_dispatch:
  push:
    branches: [ "feature/four-feature-integration" ]
    paths:
      - "patches/**"
      - "Scripts/harden_ayugram_history.py"
      - "Scripts/harden_four_feature_storage.py"
      - "Scripts/apply_four_feature_ui.py"
      - "Scripts/restore_deleted_messages_in_chat.py"
      - "Scripts/apply_ios27_scene_lifecycle.py"
      - "Experiments/PrivateInviteLinkInspector/**"
      - ".github/workflows/four-feature-compatibility.yml"
      - ".github/workflows/four-feature-simulator.yml"

permissions:
  contents: read

concurrency:
  group: four-feature-swiftgram-compatibility
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Restore Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-repository-cache
          key: ${{ runner.os }}-telegram-bazel-repository-eb5ae67a32c6-v1
          restore-keys: |
            ${{ runner.os }}-telegram-bazel-repository-eb5ae67a32c6-

      - name: Restore Bazel disk build cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-disk-cache
          key: ${{ runner.os }}-telegram-bazel-disk-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-telegram-bazel-disk-v1-

      - name: Select Telegram-required Xcode and verify iOS SDK
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          test -f "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Install Bazelisk
        run: |
          brew list bazelisk >/dev/null 2>&1 || brew install bazelisk
          USE_BAZEL_VERSION=8.4.2 bazelisk --version

      - name: Clone Telegram-iOS baseline
        run: |
          git clone --recursive https://github.com/Swiftgram/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout --detach eb5ae67a32c6e8b936ca0e875f19f99251112f17
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Verify Telegram toolchain
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          import json
          with open("versions.json", encoding="utf-8") as f:
              v = json.load(f)
          assert v["app"] == "12.9.2", v
          assert v["xcode"] == "26.2", v
          print("Telegram-iOS baseline:", v["app"])
          print("Required Xcode:", v["xcode"])
          print("Required macOS runner:", v["macos"])
          PY

      - name: Apply AyuGram patch
        run: |
          cp patches/ayugram-1.3.0.patch telegram-ios/ayugram-1.3.0.patch
          cd telegram-ios
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("ayugram-1.3.0.patch").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^diff --git ", patch)
          applied = []

          for raw in sections[1:]:
              lines = raw.splitlines()
              header = lines[0]
              m = re.match(r"a/(.+?) b/(.+)$", header)
              if not m:
                  raise SystemExit(f"Bad diff header: {header!r}")
              target = Path(m.group(2))
              meta = lines[1:8]
              is_new = any(x.startswith("new file mode ") for x in meta)
              is_deleted = any(x.startswith("deleted file mode ") for x in meta)

              hunks = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("@@ "):
                      hm = re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", lines[i])
                      if not hm:
                          raise SystemExit(f"Bad hunk header in {target}: {lines[i]!r}")
                      old_start = int(hm.group(1))
                      body = []
                      i += 1
                      while i < len(lines) and not lines[i].startswith("@@ ") and not lines[i].startswith("diff --git "):
                          if not lines[i].startswith("\\ No newline at end of file"):
                              body.append(lines[i])
                          i += 1
                      hunks.append((old_start, body))
                  else:
                      i += 1

              if is_deleted:
                  if target.exists():
                      target.unlink()
                  applied.append(str(target))
                  continue

              if is_new:
                  new_lines = []
                  for line in hunks[0][1] if hunks else []:
                      if line.startswith("+") or line.startswith(" "):
                          new_lines.append(line[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("\n".join(new_lines) + ("\n" if new_lines else ""), encoding="utf-8")
                  applied.append(str(target))
                  continue

              if not target.exists():
                  raise SystemExit(f"Target file missing: {target}")
              current = target.read_text(encoding="utf-8").splitlines()
              cursor = 0

              for old_line, body in hunks:
                  old_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("-")]
                  new_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("+")]

                  if old_lines:
                      hint = max(0, old_line - 1)
                      positions = [hint] + list(range(cursor, max(cursor, len(current) - len(old_lines) + 1)))
                      seen = set()
                      found = None
                      for pos in positions:
                          if pos in seen:
                              continue
                          seen.add(pos)
                          if pos + len(old_lines) <= len(current) and current[pos:pos + len(old_lines)] == old_lines:
                              found = pos
                              break
                      if found is None:
                          raise SystemExit(f"Context mismatch applying {target} near old line {old_line}")
                      current[found:found + len(old_lines)] = new_lines
                      cursor = found + len(new_lines)
                  else:
                      insert_at = max(0, min(len(current), old_line - 1))
                      current[insert_at:insert_at] = new_lines
                      cursor = insert_at + len(new_lines)

              target.write_text("\n".join(current) + ("\n" if current else ""), encoding="utf-8")
              applied.append(str(target))

          print("Applied", len(applied), "diff sections")
          for path in applied:
              print("  ", path)

          PY
          git diff --check

      - name: Harden AyuGram History persistence
        working-directory: telegram-ios
        run: python3 "$GITHUB_WORKSPACE/Scripts/harden_ayugram_history.py"

      - name: Harden saved filenames against dialog collisions
        run: python3 Scripts/harden_four_feature_storage.py

      - name: Apply private preview and Before UI
        run: python3 Scripts/apply_four_feature_ui.py

      - name: Restore deleted messages inside the original chat
        run: python3 Scripts/restore_deleted_messages_in_chat.py

      - name: Backport and parse iOS 27 Scene lifecycle
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/Scripts/apply_ios27_scene_lifecycle.py"
          xcrun swiftc -frontend -parse submodules/TelegramUI/Sources/SceneDelegate.swift
          xcrun swiftc -frontend -parse submodules/TelegramUI/Sources/AppDelegate.swift
          xcrun swiftc -frontend -parse submodules/Display/Source/NativeWindowHostView.swift
          xcrun swiftc -frontend -parse submodules/Display/Source/WindowContent.swift
          xcrun swiftc -frontend -parse submodules/LegacyUI/Sources/LegacyController.swift
          echo "PASS: iOS 27 scene-lifecycle sources parse on the pinned baseline."

      - name: Parse modified Swift sources without building the app
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramUI/Sources/ChatController.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/ChatPresentationInterfaceState/Sources/ChatPresentationInterfaceState.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessages.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramUI/Components/Chat/ChatMessageBubbleItemNode/Sources/ChatMessageBubbleItemNode.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode/Sources/ChatMessageTextBubbleContentNode.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/ChatMessageDateAndStatusNode.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/AyuGramIOS/Sources/AyuGramMediaArchive.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/AyuGramIOS/Sources/AyuGramPostboxHistoryStore.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/AyuGramIOS/Sources/AyuGramCaptureService.swift
          xcrun swiftc -frontend -parse telegram-ios/submodules/AyuGramIOS/Sources/AyuGramPostboxBridge.swift
          echo "Modified Swift sources parsed successfully; no app or IPA build was run."

      - name: Prepare minimal Bazel configuration repository for library check
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          config="build-input/configuration-repository"
          mkdir -p "$config/provisioning"
          cat > "$config/MODULE.bazel" <<'EOF'
          module(name = "build_configuration")
          EOF
          : > "$config/WORKSPACE"
          : > "$config/BUILD"
          : > "$config/provisioning/BUILD"
          cat > "$config/variables.bzl" <<'EOF'
          # Non-signing placeholders used only for library/module compilation.
          telegram_bazel_path = ""
          telegram_use_xcode_managed_codesigning = True
          sg_config = ""
          telegram_bundle_id = "org.telegram.previewchecks"
          telegram_api_id = "0"
          telegram_api_hash = ""
          telegram_team_id = ""
          telegram_app_center_id = ""
          telegram_is_internal_build = "0"
          telegram_is_appstore_build = "0"
          telegram_appstore_id = "0"
          telegram_app_specific_url_scheme = "tg"
          telegram_premium_iap_product_id = ""
          telegram_aps_environment = ""
          telegram_enable_siri = False
          telegram_enable_icloud = False
          telegram_enable_watch = True
          EOF
          test -f "$config/MODULE.bazel"
          test -f "$config/variables.bzl"

      - name: Relax legacy warning-as-error flags in compatibility checkout only
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for root_name in ("Swiftgram", "submodules", "Telegram", "third-party"):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob("BUILD*"):
                  if not path.is_file():
                      continue
                  source = path.read_text(encoding="utf-8")
                  lines = source.splitlines(keepends=True)
                  kept = [line for line in lines if line.strip() != '"-warnings-as-errors",']
                  count = len(lines) - len(kept)
                  if count:
                      path.write_text("".join(kept), encoding="utf-8")
                      changed.append((str(path), count))
          if not changed:
              raise SystemExit("No legacy warnings-as-errors flags found; refusing a no-op compatibility edit")
          for path, count in changed:
              print(f"Relaxed {count} warning-as-error flag(s): {path}")
          print("PASS: changes apply only to the temporary Telegram checkout used by this compatibility test.")
          PY

      - name: Compile only the AyuGram settings Swift module
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          mkdir -p "$HOME/telegram-bazel-disk-cache"
          cat >> BUILD.bazel <<'EOF'
          platform(
              name = "ios_arm64",
              constraint_values = [
                  "@platforms//os:ios",
                  "@platforms//cpu:arm64",
              ],
          )
          EOF
          # Retry transient GitHub release/proxy failures and read timeouts. Real compile errors fail immediately.
          attempt=1
          while true; do
            set +e
            USE_BAZEL_VERSION=8.4.2 bazelisk build --repository_cache="$HOME/telegram-bazel-repository-cache" --disk_cache="$HOME/telegram-bazel-disk-cache" --jobs=4 --config=macos --apple_platform_type=ios --ios_multi_cpus=arm64 --platforms=//:ios_arm64 --features=-treat_warnings_as_errors --per_file_copt='^submodules/.*[.](m|mm)$@-Wno-error=deprecated-declarations' --verbose_failures //submodules/TelegramUI/Components/AyuGramSettingsScreen:AyuGramSettingsScreen //submodules/ChatPresentationInterfaceState:ChatPresentationInterfaceState //submodules/TelegramUI:TelegramUI //submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode:ChatMessageDateAndStatusNode 2>&1 | tee "$RUNNER_TEMP/compatibility-bazel-build.log"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge 8 ] || ! grep -Eqi "504 Gateway Time-out|502 Bad Gateway|GET returned 502|Read timed out|Connection reset|timed out" "$RUNNER_TEMP/compatibility-bazel-build.log"; then
              exit "$build_status"
            fi
            next_attempt=$((attempt + 1))
            delay=$((attempt * 20))
            if [ "$delay" -gt 120 ]; then delay=120; fi
            echo "::warning::Transient Bazel dependency network failure; retrying (attempt $next_attempt/8) after ${delay}s."
            attempt=$next_attempt
            sleep "$delay"
          done
          echo "AyuGram settings, TelegramUI send/preview actions, chat date/status UI and native permissions compiled; no Telegram app or IPA was built."

      - name: Verify all four feature entry points
        run: |
          set -euo pipefail
          grep -q 'text: "AyuGram Save"' telegram-ios/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
          grep -q 'AyuGramCaptureService.captureDeleted' telegram-ios/submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessages.swift
          grep -q 'AyuGramOriginalMediaPreviewController' telegram-ios/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
          grep -q 'Preview Private Group' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'privateInvitePreviewBackButton' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'entryView.onBack' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'joinLinkInformation(hash)' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'case let .peek(peer, deadline):' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'ChatPeekTimeout(deadline: deadline, linkData: hash)' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          grep -q 'navigateToChatController(' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          ! grep -q 'applicationBindings.openUrl(raw)' telegram-ios/submodules/TelegramUI/Components/AyuGramSettingsScreen/Sources/AyuGramSettingsScreen.swift
          python3 - <<'PY'
          from pathlib import Path
          source = Path("telegram-ios/submodules/TelegramUI/Sources/ChatController.swift").read_text(encoding="utf-8")
          start = source.index("if let peekData = self.peekData")
          end = source.index("self.checksTooltipDisposable", start)
          peek_timeout = source[start:end]
          assert "AyuGram read-only peek: suppress Join action" in peek_timeout
          assert "Conversation_PrivateChannelTimeLimitedAlertJoin" not in peek_timeout
          assert "joinChatInteractively" not in peek_timeout
          assert "ChatPeekTimeout" in source
          assert "ayuGramCanSendMessagesInCurrentChat" in source, "Read-only preview message gate is missing"
          assert "ayuGramCanSendReactionsInCurrentChat" in source, "Read-only preview reaction gate is missing"
          assert source.count("guard case nil = self.peekData") >= 4, "Peek state must block messages, reactions and group calls"
          assert source.count("canSendMessagesToChat(self.presentationInterfaceState)") == 1, "Native message permission should only be called inside the scoped wrapper"
          assert source.count("canSendReactionsToChat(self.presentationInterfaceState)") == 1, "Native reaction permission should only be called inside the scoped wrapper"
          assert "canSendMessagesToChat(strongSelf.presentationInterfaceState)" not in source
          assert "canSendReactionsToChat(strongSelf.presentationInterfaceState)" not in source
          send_start = source.index("func sendMessages(_ messages: [EnqueueMessage]")
          send_body = source[send_start:send_start + 500]
          assert "guard case nil = self.peekData else { return }" in send_body, "Direct sendMessages path is not blocked during preview"
          for required in (
              "requestMessageActionCallback",
              "requestSelectMessagePollOptions",
              "requestAddMessagePollOption",
              "requestOpenMessagePollResults",
              "openMessagePollResults",
              "openJoinLink",
              "openWebView",
              "requestMessageActionUrlAuth",
              "joinVoiceChat",
              "AyuGram read-only peek: dismiss at deadline",
              "openMessageContextMenu",
              "openMessageReactionContextMenu",
              "openExternalInstantPage",
              "activateSwitchInline",
              "openUniqueGift",
              "openMessageFeeException",
              "func openUrl(",
              "func openPeerMention(",
          ):
              assert required in source, f"Preview interaction lock missing: {required}"
          assert "self.moreBarButton.isHidden = self.peekData != nil" in source, "Preview More/member menu is still visible"
          assert "chatInfoButtonItem.target = nil" in source, "Preview profile button is still active"
          assert "self?.openUrl(url, concealed: false, skipConcealedAlert: isLocation, message: nil)" not in source, "Gallery URL tap bypasses preview guard"
          assert "self?.openPeer(peer: EnginePeer(peer), navigation: navigation, fromMessage: nil)" not in source, "Gallery peer navigation bypasses preview guard"
          assert "self?.controllerInteraction?.callPeer(peerId, isVideo)" not in source, "Direct peer calls bypass preview guard"
          assert "self?.controllerInteraction?.openConferenceCall(message)" not in source, "Conference call entry bypasses preview guard"
          gallery_start = source.index("let openChatMessageParams = OpenChatMessageParams(")
          gallery_end = source.index("self.controllerInteraction?.isOpeningMediaSignal", gallery_start)
          message_gallery = source[gallery_start:gallery_end]
          for forbidden in (
              "self?.openUrl(url, concealed: false, skipConcealedAlert: isLocation, message: nil)",
              "self?.openPeer(peer: EnginePeer(peer), navigation: navigation, fromMessage: nil)",
              "self?.controllerInteraction?.callPeer(peerId, isVideo)",
              "self?.controllerInteraction?.openConferenceCall(message)",
              "self?.sendMessages([message])",
          ):
              assert forbidden not in message_gallery, f"Unblocked message-gallery action remains: {forbidden}"
          action_start = source.index("actionInteraction: GalleryControllerActionInteraction(")
          action_end = source.index("navigateToMessageContext:", action_start)
          gallery_actions = source[action_start:action_end]
          assert gallery_actions.count("guard let self, case nil = self.peekData else { return }") >= 9, "Gallery navigation and state-changing callbacks are not fully read-only"
          edit_media_start = gallery_actions.index("editMedia:")
          edit_media_end = gallery_actions.index("updateCanReadHistory:", edit_media_start)
          edit_media_action = gallery_actions[edit_media_start:edit_media_end]
          assert "guard let self, case nil = self.peekData else {" in edit_media_action, "Gallery media editing remains enabled in preview"
          assert "guard case nil = self.peekData else { return }" in gallery_actions, "Gallery media-send callback is not blocked"
          assert "self.openUrlIn(url)" in gallery_actions and "guard let self, case nil = self.peekData else { return }" in gallery_actions, "In-app gallery URL action is not scoped"
          assert "guard case nil = self.peekData else { return }" in source[source.index("public override func joinGroupCall"):], "A direct group-call path remains open"
          state_source = Path("telegram-ios/submodules/ChatPresentationInterfaceState/Sources/ChatPresentationInterfaceState.swift").read_text(encoding="utf-8")
          gate_start = state_source.index("public func canSendMessagesToChat")
          gate_end = state_source.index("public func canSendReactionsToChat", gate_start)
          send_gate = state_source[gate_start:gate_end]
          assert "canSendMessagesToPeer(EnginePeer(peer), ignoreDefault: canBypassRestrictions)" in send_gate, "Telegram native message-permission check was changed or removed"
          react_start = state_source.index("public func canSendReactionsToChat")
          react_end = state_source.index("public func canJoinInaccessibleCommunityChat", react_start)
          reaction_gate = state_source[react_start:react_end]
          assert "canSendReactionsToPeer(EnginePeer(peer), ignoreDefault: canBypassRestrictions)" in reaction_gate, "Telegram native reaction-permission check was changed or removed"
          assert "AyuGram read-only peek send gate" not in send_gate, "Do not inject a global membership override into ordinary chats"
          assert "AyuGram read-only peek reactions gate" not in reaction_gate, "Do not inject a global membership override into ordinary chats"
          print("PASS: Telegram's native permissions remain authoritative in ordinary chats.")
          print("PASS: every message/reaction send path is denied while ChatPeekTimeout is active.")
          history_store = Path("telegram-ios/submodules/AyuGramIOS/Sources/AyuGramPostboxHistoryStore.swift").read_text(encoding="utf-8")
          media_archive = Path("telegram-ios/submodules/AyuGramIOS/Sources/AyuGramMediaArchive.swift").read_text(encoding="utf-8")
          capture_service = Path("telegram-ios/submodules/AyuGramIOS/Sources/AyuGramCaptureService.swift").read_text(encoding="utf-8")
          assert "fromName: snapshot.fromName" in history_store
          assert "deletedAt: snapshot.deletedAt" in history_store
          assert "revisionKey: String? = nil" in media_archive
          assert "revisionKey.map" in media_archive
          for revision in ('revisionKey: "deleted"', 'revisionKey: "manual-\\(UUID().uuidString)"', 'revisionKey: "edit-\\(editDate)-\\(UUID().uuidString)"'):
              assert revision in capture_service, f"Missing immutable archive route: {revision}"
          assert "AyuGramCaptureService.captureEdited(" in Path("telegram-ios/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift").read_text(encoding="utf-8")
          assert "fromName: senderName" in capture_service, "Edited snapshot must preserve the pre-edit sender"
          edit_hook = Path("telegram-ios/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift").read_text(encoding="utf-8")
          assert "senderName: {" in edit_hook, "Pre-edit author name is not resolved before replacement"
          save_now = capture_service.split("public static func saveNow", 1)[1].split("public static func captureEdited", 1)[0]
          assert "fromName: snapshot.fromName" in save_now, "Manual Saved metadata dropped sender name"
          assert "deletedAt: snapshot.deletedAt" in save_now, "Manual Saved metadata dropped deletion time"
          assert "guard let archivedPath = archived.path" in save_now, "Manual Save must reject incomplete media archives"
          assert "else if snapshot.text.isEmpty" in save_now, "Manual Save must reject empty/no-media snapshots"
          assert "saveDeletedMessages == true" in capture_service
          assert "AyuGramPostboxHistoryStore.appendDeleted" in capture_service
          assert "AyuGramPostboxHistoryStore.appendEdited" in capture_service
          delete_core = Path("telegram-ios/submodules/TelegramCore/Sources/TelegramEngine/Messages/DeleteMessages.swift").read_text(encoding="utf-8")
          delete_updates = Path("telegram-ios/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift").read_text(encoding="utf-8")
          date_status = Path("telegram-ios/submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/ChatMessageDateAndStatusNode.swift").read_text(encoding="utf-8")
          bubble_node = Path("telegram-ios/submodules/TelegramUI/Components/Chat/ChatMessageBubbleItemNode/Sources/ChatMessageBubbleItemNode.swift").read_text(encoding="utf-8")
          text_bubble_node = Path("telegram-ios/submodules/TelegramUI/Components/Chat/ChatMessageTextBubbleContentNode/Sources/ChatMessageTextBubbleContentNode.swift").read_text(encoding="utf-8")
          assert "preserveDeletedMessagesInChat: true" in delete_updates
          assert "-> Set<MessageId>" in delete_core
          assert "@discardableResult" in delete_core
          assert "idsToDelete = ids.filter" in delete_core
          assert "EditedMessageAttribute(date: Int32.min, isHidden: true)" in delete_core
          assert 'updatedDateText = "🧹 \\(updatedDateText)"' in date_status
          assert "isAyuGramDeleted = true" in bubble_node
          assert "isAyuGramDeleted = true" in text_bubble_node
          assert "isAyuGramDeleted: isAyuGramDeleted" in text_bubble_node
          global_delete_start = delete_updates.index("case let .DeleteMessagesWithGlobalIds(ids):")
          global_delete_end = delete_updates.index("case let .DeleteMessages(ids):", global_delete_start)
          global_delete = delete_updates[global_delete_start:global_delete_end]
          assert "transaction.messageIdsForGlobalIds(ids)" in global_delete
          assert "ayuRetainedGlobalIds" in global_delete
          assert "ayuGlobalIdsToDelete = ids.filter" in global_delete
          direct_delete_start = delete_updates.index("case let .DeleteMessages(ids):")
